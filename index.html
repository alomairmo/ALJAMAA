    <!-- تحسين الخط العربي -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }

        /* تنسيقات خطوط الربط الهرمية للمشجرة من الأعلى للأسفل (RTL) */
        .tree-wrapper {
            direction: rtl;
        }
        .tree ul {
            padding-top: 24px;
            position: relative;
            transition: all 0.3s;
            display: flex;
            justify-content: center;
        }
        .tree li {
            float: right;
            text-align: center;
            list-style-type: none;
            position: relative;
            padding: 24px 12px 0 12px;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* الخطوط الأفقية فوق الأبناء */
        .tree li::before, .tree li::after {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            border-top: 2px solid #cbd5e1;
            width: 50%;
            height: 24px;
        }
        .tree li::after {
            right: 50%;
            left: auto;
            border-left: 2px solid #cbd5e1;
        }
        /* إزالة الخطوط الزائدة للعقد الوحيدة أو الطرفية */
        .tree li:only-child::after, .tree li:only-child::before {
            display: none;
        }
        .tree li:only-child {
            padding-top: 0;
        }
        /* أول ابن (في أقصى اليمين في RTL) */
        .tree li:first-child::before {
            border: 0 none;
        }
        .tree li:first-child::after {
            border-radius: 0 8px 0 0;
        }
        /* آخر ابن (في أقصى اليسار في RTL) */
        .tree li:last-child::after {
            border: 0 none;
        }
        .tree li:last-child::before {
            border-left: 2px solid #cbd5e1;
            border-radius: 8px 0 0 0;
        }
        /* الخط العمودي النازل من الأب إلى خط الأبناء */
        .tree ul ul::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            border-left: 2px solid #cbd5e1;
            width: 0;
            height: 24px;
        }

        /* تمييز خطوط حزمة الزوجة (الأم) باللون الوردي أو الأحمر الغامق عند الانفصال */
        .tree li.wife-group-node::before,
        .tree li.wife-group-node::after {
            border-color: #f472b6;
        }
        .tree li.wife-group-node > ul::before {
            border-color: #f472b6;
        }
        .tree li.wife-group-node > ul > li::before,
        .tree li.wife-group-node > ul > li::after {
            border-color: #f472b6;
        }

        .tree li.wife-group-divorced::before,
        .tree li.wife-group-divorced::after {
            border-color: #991b1b;
        }
        .tree li.wife-group-divorced > ul::before {
            border-color: #991b1b;
        }
        .tree li.wife-group-divorced > ul > li::before,
        .tree li.wife-group-divorced > ul > li::after {
            border-color: #991b1b;
        }

        /* تحسين شريط التمرير */
        .custom-scrollbar::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>

        const PersonAvatar = ({ card, sizeClass = "w-16 h-16", imgClassName = "object-cover" }) => {
            const isFemale = card?.gender === 'female';
            const shapeClass = isFemale
                ? 'rounded-full bg-pink-50 border-2 border-pink-300 shadow-pink-100'
                : 'rounded-2xl bg-sky-50 border-2 border-sky-300 shadow-sky-100';

            return (
                <div className={`${sizeClass} ${shapeClass} overflow-hidden flex items-center justify-center shadow-sm shrink-0 relative`}>
                    {card?.image ? (

                                src={card.image}
                                alt={card.name || 'صورة'}
                                className={`w-full h-full ${imgClassName}`}
                                onError={(e) => {

                                    if (e.target.nextSibling) e.target.nextSibling.style.display = 'block';

                            />

                                {isFemale ? <AsiriWomanAvatar /> : <MaleDefaultAvatar />}
                            </div>
                        </>
                    ) : (
                        isFemale ? <AsiriWomanAvatar /> : <MaleDefaultAvatar />
                    )}
                </div>
            );
        };

        const stripClanSuffix = (fullName) => {
            if (!fullName) return '';
            return fullName.replace(/\s*-\s*آل السعيدي\s*-\s*آل سعد\s*-\s*بلّسمر\s*$/g, '').trim();
        };

        const detectGenderFromText = (rawText, fallbackGender = 'male') => {
            if (!rawText || typeof rawText !== 'string') return fallbackGender;
            const normalized = rawText.replace(/\s+/g, ' ').trim();
            if (/(?:^|\s)(?:بنت|ابنة)(?:\s|$)/i.test(normalized)) {
                return 'female';
            }
            if (/(?:^|\s)(?:بن|ابن)(?:\s|$)/i.test(normalized)) {
                return 'male';
            }
            return fallbackGender;
        };

        const parseNameParts = (fullName) => {
            const withoutClan = stripClanSuffix(fullName);
            if (!withoutClan) return [''];
            const splitByConnectors = withoutClan
                .replace(/\s+(?:بن|بنت|ابن|ابنة)\s+/gi, '\n')
                .split(/\n+/)
                .map(s => s.trim())
                .filter(Boolean);

            // المسافات لا تفصل بين الأسماء إطلاقًا: "محمد خالد" اسم واحد كامل.
            // الفاصل الوحيد دون بن/بنت هو كلمة "آل" التي تلتصق بما بعدها وتفصل عمّا قبلها
            const groupAlTokens = (segment) => {
                const tokens = segment.split(/\s+/).filter(Boolean);
                const parts = [];
                let buffer = [];
                for (let i = 0; i < tokens.length; i++) {
                    if (tokens[i] === 'آل' && tokens[i + 1]) {
                        if (buffer.length) {
                            parts.push(buffer.join(' '));
                            buffer = [];
                        }
                        // "آل" جزء لا يتجزأ مما يليها، وفاصل عمّا قبلها
                        parts.push(`${tokens[i]} ${tokens[i + 1]}`);
                        i++;
                    } else {
                        buffer.push(tokens[i]);
                    }
                }
                if (buffer.length) {
                    parts.push(buffer.join(' '));
                }
                return parts;
            };

            if (splitByConnectors.length > 1) {
                return splitByConnectors.flatMap(groupAlTokens);
            }

            const parts = groupAlTokens(withoutClan);
            return parts.length > 0 ? parts : [''];
        };

        const buildFullName = (parts, gender = 'male', includeClan = true) => {
            const validParts = parts.map(p => p.trim()).filter(Boolean);
            if (validParts.length === 0) return '';
            const firstConnector = gender === 'female' ? 'بنت' : 'بن';
            let personChain = validParts[0];
            for (let i = 1; i < validParts.length; i++) {
                const conn = i === 1 ? firstConnector : 'بن';
                personChain += ` ${conn} ${validParts[i]}`;
            }
            return includeClan ? `${personChain} - ${CLAN_ROOT_TITLE}` : personChain;
        };

        function App() {
          const [cards, setCards] = useState([]);
          const [view, setView] = useState('gallery');
          const [showNames, setShowNames] = useState(true);
          const [selectedCard, setSelectedCard] = useState(null);
          const [galleryShowInfo, setGalleryShowInfo] = useState(false);
          const [hideMalesNoImage, setHideMalesNoImage] = useState(false);
          const [hideNoDescription, setHideNoDescription] = useState(false);
          const [editingCard, setEditingCard] = useState(null);

          const [user, setUser] = useState(null);
          const [loadingData, setLoadingData] = useState(true);
          const [authError, setAuthError] = useState('');
          const [dbError, setDbError] = useState('');

          const [quizQueue, setQuizQueue] = useState([]);
          const [quizShowInfo, setQuizShowInfo] = useState(false);

          const [searchQuery, setSearchQuery] = useState('');
          const [viewMode, setViewMode] = useState('all');
          const [activeFolder, setActiveFolder] = useState(null);

          const [activeTreeSubTab, setActiveTreeSubTab] = useState('ALL');
          const [newTreeTitle, setNewTreeTitle] = useState('');
          const [newTreeRootName, setNewTreeRootName] = useState('');
          const [newTreeRootGender, setNewTreeRootGender] = useState('male');
          const [showNewTreeModal, setShowNewTreeModal] = useState(false);

          const [quickBranchParent, setQuickBranchParent] = useState(null);
          const [quickBranchMotherId, setQuickBranchMotherId] = useState(null);
          const [quickBranchMode, setQuickBranchMode] = useState('choose');
          const [quickBranchSearch, setQuickBranchSearch] = useState('');
          const [quickBranchName, setQuickBranchName] = useState('');
          const [quickBranchGender, setQuickBranchGender] = useState('male');
          const [isSavingBranch, setIsSavingBranch] = useState(false);
          const [treeZoom, setTreeZoom] = useState(1);
          const [treeSize, setTreeSize] = useState({ w: 0, h: 0 });

          const [draggingLine, setDraggingLine] = useState(null);
          const [hoveredWomanId, setHoveredWomanId] = useState(null);
          const [connectorLines, setConnectorLines] = useState([]);
          const [isPanning, setIsPanning] = useState(false);
          const panState = useRef(null);
          const panRaf = useRef(null);
          const treeContainerRef = useRef(null);
          const lineAnchorRefs = useRef(new Map());
          const womanCardRefs = useRef(new Map());

          const [deleteConfirmCard, setDeleteConfirmCard] = useState(null);
          const [toastMessage, setToastMessage] = useState(null);

          const showNotification = (msg, type = 'info') => {
              setToastMessage({ msg, type });
              setTimeout(() => setToastMessage(null), 4000);
          };

          const cardsMap = useMemo(() => {
              const map = new Map();
              cards.forEach(c => map.set(c.id, c));
              return map;
          }, [cards]);

          const getLineageChain = useCallback((card, allCardsMap) => {
              // الاسم المخزن محدَّث مع كل ربط/نقل، فإن كان متعدد الأجزاء فهو السلسلة الأدق
              const parsed = card?.name ? parseNameParts(card.name) : [];
              if (parsed.length > 1) return parsed;
              const chain = [];
              let current = card;
              const visited = new Set();
              while (current && !visited.has(current.id)) {
                  visited.add(current.id);
                  const fName = current.firstName || parseNameParts(current.name)[0] || '';
                  if (fName) chain.push(fName);
                  current = current.parentId ? allCardsMap.get(current.parentId) : null;
              }
              return chain.length > 0 ? chain : parsed;
          }, []);

          const getEffectiveGender = useCallback((card) => {
              if (!card) return 'male';
              return detectGenderFromText(card.name || '', card.gender || 'male');
          }, []);

          const getDisplayFullName = useCallback((card) => {
              if (!card) return 'بدون اسم';
              const chain = getLineageChain(card, cardsMap);
              const gender = getEffectiveGender(card);
              if (chain.length > 0 && chain[0]) {
                  return buildFullName(chain, gender, true);
              }
              const base = stripClanSuffix(card.name);
              return base ? `${base} - ${CLAN_ROOT_TITLE}` : CLAN_ROOT_TITLE;
          }, [cardsMap, getLineageChain, getEffectiveGender]);

          const existingCandidateCards = useMemo(() => {
              if (!quickBranchParent) return [];
              const forbiddenIds = new Set();
              let curr = cardsMap.get(quickBranchParent.id);
              while (curr && !forbiddenIds.has(curr.id)) {
                  forbiddenIds.add(curr.id);
                  curr = curr.parentId ? cardsMap.get(curr.parentId) : null;
              }

              const q = quickBranchSearch.trim().toLowerCase();
              return cards.filter(c => {
                  if (forbiddenIds.has(c.id)) return false;
                  if (!q) return true;
                  const displayFull = getDisplayFullName(c).toLowerCase();
                  const first = (c.firstName || '').toLowerCase();
                  const desc = (c.description || '').toLowerCase();
                  return displayFull.includes(q) || first.includes(q) || desc.includes(q);
              });
          }, [quickBranchParent, quickBranchSearch, cards, cardsMap, getDisplayFullName]);

          useEffect(() => {
            const initAuth = async () => {
              try {
                await signInAnonymously(auth);
              } catch (error) {
                console.error("Auth Error:", error);
                if (error.code === 'auth/configuration-not-found') {
                  setAuthError('يرجى تفعيل "تسجيل الدخول كمجهول" (Anonymous Auth) من لوحة تحكم Firebase.');
                } else {
                  setAuthError(error.message);
                }
                setLoadingData(false);
              }
            };
            initAuth();
            
            const unsubscribe = onAuthStateChanged(auth, setUser);
            return () => unsubscribe();
          }, []);

          useEffect(() => {
            if (!user) return;

            const unsubscribe = onSnapshot(collection(db, "flashcards"), (snapshot) => {
              const fetchedCards = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              setCards(fetchedCards);
              setLoadingData(false);
              setDbError('');
            }, (error) => {
              console.error("Firestore Error:", error);
              if (error.code === 'permission-denied') {
                setDbError('ليس لديك صلاحية قراءة أو كتابة البيانات. تأكد من تعديل قواعد Firestore.');
              } else {
                setDbError(error.message);
              }
              setLoadingData(false);
            });
            return () => unsubscribe();
          }, [user]);

          useEffect(() => {
              if (selectedCard) {
                  const updated = cards.find(c => c.id === selectedCard.id);
                  if (updated) setSelectedCard(updated);
              }
          }, [cards]);

          const allAvailableTags = useMemo(() => {
              return Array.from(new Set(cards.flatMap(c => c.tags || [])));
          }, [cards]);

          const filteredCards = cards.filter(card => {
            const searchLower = searchQuery.toLowerCase();
            return !searchQuery ||
              (card.name && card.name.toLowerCase().includes(searchLower)) ||
              (card.firstName && card.firstName.toLowerCase().includes(searchLower)) ||
              (card.description && card.description.toLowerCase().includes(searchLower)) ||
              (card.tags && card.tags.some(t => t.toLowerCase().includes(searchLower)));
          });

          // فلاتر عرض "كل الصور": إخفاء الذكور بلا صور، وإخفاء من بلا وصف/معلومات
          const galleryCards = filteredCards.filter(card => {
            if (hideMalesNoImage && getEffectiveGender(card) === 'male' && !card.image) return false;
            if (hideNoDescription && !(card.description && card.description.trim())) return false;
            return true;
          });

          const folders = {};
          filteredCards.forEach(card => {
            const cardTags = card.tags && card.tags.length > 0 ? card.tags : ['بدون تصنيف'];
            cardTags.forEach(tag => {
              if (!folders[tag]) folders[tag] = [];
              folders[tag].push(card);
            });
          });

          const getFatherMarriages = useCallback((fatherCard) => {
              if (!fatherCard) return [];
              const explicitMarriages = (Array.isArray(fatherCard.marriages) ? [...fatherCard.marriages] : []).filter(m => m.wifeId !== fatherCard.id);
              const seenWives = new Set(explicitMarriages.map(m => m.wifeId));

              cards.forEach(child => {
                  if (child.parentId === fatherCard.id && child.motherId && !seenWives.has(child.motherId)) {
                      seenWives.add(child.motherId);
                      explicitMarriages.push({
                          wifeId: child.motherId,
                          status: child.parentsDivorced ? 'divorced' : 'active'
                      });
                  }
              });

              return explicitMarriages.filter(m => cardsMap.has(m.wifeId));
          }, [cards, cardsMap]);

          const getWomanMarriages = useCallback((womanCard) => {
              if (!womanCard) return [];
              const results = [];
              const seenHusbands = new Set();

              cards.forEach(person => {
                  if (Array.isArray(person.marriages)) {
                      const found = person.marriages.find(m => m.wifeId === womanCard.id);
                      if (found && !seenHusbands.has(person.id) && person.id !== womanCard.id) {
                          seenHusbands.add(person.id);
                          results.push({
                              husband: person,
                              status: found.status || 'active',
                              children: cards.filter(c => c.parentId === person.id && c.motherId === womanCard.id)
                          });
                      }
                  }
              });

              cards.forEach(child => {
                  if (child.motherId === womanCard.id && child.parentId && !seenHusbands.has(child.parentId)) {
                      const husband = cardsMap.get(child.parentId);
                      if (husband) {
                          seenHusbands.add(husband.id);
                          results.push({
                              husband,
                              status: child.parentsDivorced ? 'divorced' : 'active',
                              children: cards.filter(c => c.parentId === husband.id && c.motherId === womanCard.id)
                          });
                      }
                  }
              });

              return results;
          }, [cards, cardsMap]);

          const linkChildrenLineToMother = async (fatherId, sourceMotherId, womanId) => {
              if (!fatherId || !womanId || fatherId === womanId) return;
              const father = cardsMap.get(fatherId);
              const woman = cardsMap.get(womanId);
              if (!father || !woman) return;

              if (getEffectiveGender(woman) !== 'female') {
                  showNotification("يرجى سحب الخط وإفلاته على بطاقة امرأة (أنثى) ليتم التعرف عليها كأم", "error");
                  return;
              }

              try {
                  const existingMarriages = Array.isArray(father.marriages) ? [...father.marriages] : [];
                  const marriageIdx = existingMarriages.findIndex(m => m.wifeId === womanId);
                  if (marriageIdx === -1) {
                      existingMarriages.push({ wifeId: womanId, status: 'active' });
                  } else {
                      existingMarriages[marriageIdx] = { ...existingMarriages[marriageIdx], status: 'active' };
                  }
                  await updateDoc(doc(db, "flashcards", father.id), { marriages: existingMarriages });

                  const womanHusbands = Array.isArray(woman.husbandIds) ? [...woman.husbandIds] : [];
                  if (!womanHusbands.includes(father.id)) {
                      womanHusbands.push(father.id);
                      await updateDoc(doc(db, "flashcards", woman.id), { husbandIds: womanHusbands });
                  }

                  const targetChildren = cards.filter(c => {
                      if (c.parentId !== father.id) return false;
                      if (sourceMotherId === 'UNASSIGNED') {
                          return !c.motherId;
                      }
                      return c.motherId === sourceMotherId;
                  });

                  for (const child of targetChildren) {
                      await updateDoc(doc(db, "flashcards", child.id), {
                          motherId: woman.id,
                          parentsDivorced: false
                      });
                  }

                  const womanFirst = woman.firstName || parseNameParts(woman.name)[0];
                  const fatherFirst = father.firstName || parseNameParts(father.name)[0];
                  showNotification(
                      targetChildren.length > 0
                          ? `تم ربط (${womanFirst}) كأم لـ ${targetChildren.length} من أبناء (${fatherFirst}) وزوجة له`
                          : `تمت إضافة (${womanFirst}) كزوجة مستقلة لـ (${fatherFirst}) بخط أبناء مستقل`,
                      "success"
                  );
              } catch (err) {
                  console.error("Error linking mother:", err);
                  showNotification("حدث خطأ أثناء ربط الأم بخط الأبناء", "error");
              }
          };

          const toggleMarriageDivorceStatus = async (fatherId, wifeId) => {
              const father = cardsMap.get(fatherId);
              if (!father) return;
              try {
                  const marriages = getFatherMarriages(father);
                  const current = marriages.find(m => m.wifeId === wifeId);
                  const nextStatus = current?.status === 'divorced' ? 'active' : 'divorced';

                  const updatedMarriages = marriages.map(m =>
                      m.wifeId === wifeId ? { ...m, status: nextStatus } : m
                  );
                  await updateDoc(doc(db, "flashcards", father.id), { marriages: updatedMarriages });

                  const sharedChildren = cards.filter(c => c.parentId === fatherId && c.motherId === wifeId);
                  for (const child of sharedChildren) {
                      await updateDoc(doc(db, "flashcards", child.id), {
                          parentsDivorced: nextStatus === 'divorced'
                      });
                  }

                  showNotification(
                      nextStatus === 'divorced'
                          ? "تم تحديد العلاقة كـ (تم الانفصال) باللون الأحمر الغامق وعلامة X"
                          : "تمت إعادة حالة الزواج إلى متصل",
                      "info"
                  );
              } catch (err) {
                  console.error("Error toggling divorce:", err);
                  showNotification("حدث خطأ أثناء تحديث حالة الانفصال", "error");
              }
          };

          const unlinkMotherFromFather = async (fatherId, wifeId) => {

                  for (const child of sharedChildren) {

          // إزالة الابن من أبيه (تصبح بطاقة حرة غير مرتبطة)
          const unlinkChildFromParent = async (childId) => {

          // الانتقال إلى بطاقة قريب من داخل شاشة التعديل: إغلاق نافذة التعديل وفتح بطاقته
          const navigateToRelative = (relative) => {

          // حساب إحداثيات خطوط الزواج/الأمومة بدقة من حافة بطاقة الأم إلى حافة شارة خط الأبناء
          const recomputeMotherConnectorLines = useCallback(() => {
              if (viewMode !== 'tree' || !treeContainerRef.current) {
                  setConnectorLines([]);
                  return;
              }
              const container = treeContainerRef.current;
              const containerRect = container.getBoundingClientRect();
              setTreeSize({
                  w: Math.max(container.scrollWidth, container.clientWidth),
                  h: Math.max(container.scrollHeight, container.clientHeight)
              });
              // الحاوية باتجاه LTR داخلياً حتى تكون scrollLeft موجبة وثابتة في جميع المتصفحات
              const scrollLeft = Math.max(0, container.scrollLeft);
              const scrollTop = Math.max(0, container.scrollTop);
              const z = treeZoom || 1;

              // تحويل إحداثيات النافذة (التي تتأثر بالزوم) إلى إحداثيات المحتوى غير المكبّرة
              const toContentX = (clientX) => ((clientX - containerRect.left) / z) + scrollLeft;
              const toContentY = (clientY) => ((clientY - containerRect.top) / z) + scrollTop;

              const lines = [];

              lineAnchorRefs.current.forEach((anchorEl, anchorKey) => {
                  if (!anchorEl || !anchorEl.isConnected) return;
                  const [fatherId, wifeId] = anchorKey.split('__');
                  if (!wifeId || wifeId === 'UNASSIGNED') return;

                  const womanEl = womanCardRefs.current.get(wifeId);
                  if (!womanEl || !womanEl.isConnected) return;

                  const aRect = anchorEl.getBoundingClientRect();
                  const wRect = womanEl.getBoundingClientRect();

                  // حساب منتصف كل عنصر في إحداثيات المحتوى الكاملة داخل الحاوية
                  const wCenterX = toContentX(wRect.left + wRect.width / 2);
                  const wCenterY = toContentY(wRect.top + wRect.height / 2);
                  const aCenterX = toContentX(aRect.left + aRect.width / 2);
                  const aCenterY = toContentY(aRect.top + aRect.height / 2);

                  // اختيار نقطة الانطلاق من الحافة الأقرب لبطاقة الأم نحو الشارة
                  const dx = aCenterX - wCenterX;
                  const dy = aCenterY - wCenterY;

                  let x1 = wCenterX;
                  let y1 = wCenterY;
                  if (Math.abs(dx) > Math.abs(dy)) {
                      x1 = toContentX(dx >= 0 ? wRect.right : wRect.left);
                  } else {
                      y1 = toContentY(dy >= 0 ? wRect.bottom : wRect.top);
                  }

                  let x2 = aCenterX;
                  let y2 = aCenterY;
                  if (Math.abs(dx) > Math.abs(dy)) {
                      x2 = toContentX(dx >= 0 ? aRect.left : aRect.right);
                  } else {
                      y2 = toContentY(dy >= 0 ? aRect.top : aRect.bottom);
                  }

                  const father = cardsMap.get(fatherId);
                  const marriage = father ? getFatherMarriages(father).find(m => m.wifeId === wifeId) : null;
                  const isDivorced = marriage?.status === 'divorced';

                  lines.push({
                      key: anchorKey,
                      fatherId,
                      wifeId,
                      x1,
                      y1,
                      x2,
                      y2,
                      isDivorced
                  });
              });

              setConnectorLines(lines);
          }, [viewMode, cards, cardsMap, getFatherMarriages, treeZoom]);

          useEffect(() => {
              const timer1 = setTimeout(recomputeMotherConnectorLines, 60);
              const timer2 = setTimeout(recomputeMotherConnectorLines, 260);
              window.addEventListener('resize', recomputeMotherConnectorLines);
              return () => {
                  clearTimeout(timer1);
                  clearTimeout(timer2);
                  window.removeEventListener('resize', recomputeMotherConnectorLines);
              };
          }, [recomputeMotherConnectorLines, activeTreeSubTab, treeZoom, searchQuery]);

          useEffect(() => {
              if (!draggingLine) return;

              const handlePointerMove = (e) => {
                  if (!treeContainerRef.current) return;
                  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                  const rect = treeContainerRef.current.getBoundingClientRect();
                  const z = treeZoom || 1;
                  const x = ((clientX - rect.left) / z) + Math.max(0, treeContainerRef.current.scrollLeft);
                  const y = ((clientY - rect.top) / z) + Math.max(0, treeContainerRef.current.scrollTop);

                  setDraggingLine(prev => prev ? { ...prev, currentX: x, currentY: y } : null);

                  let foundWomanId = null;
                  womanCardRefs.current.forEach((el, wId) => {
                      if (!el) return;
                      const wRect = el.getBoundingClientRect();
                      if (
                          clientX >= wRect.left - 8 &&
                          clientX <= wRect.right + 8 &&
                          clientY >= wRect.top - 8 &&
                          clientY <= wRect.bottom + 8
                      ) {
                          foundWomanId = wId;
                      }
                  });
                  setHoveredWomanId(foundWomanId);
              };

              const handlePointerUp = async () => {
                  if (draggingLine && hoveredWomanId) {
                      await linkChildrenLineToMother(
                          draggingLine.fatherId,
                          draggingLine.sourceMotherId,
                          hoveredWomanId
                      );
                  }
                  setDraggingLine(null);
                  setHoveredWomanId(null);
              };

              window.addEventListener('mousemove', handlePointerMove);
              window.addEventListener('mouseup', handlePointerUp);
              window.addEventListener('touchmove', handlePointerMove, { passive: false });
              window.addEventListener('touchend', handlePointerUp);

              return () => {
                  window.removeEventListener('mousemove', handlePointerMove);
                  window.removeEventListener('mouseup', handlePointerUp);
                  window.removeEventListener('touchmove', handlePointerMove);
                  window.removeEventListener('touchend', handlePointerUp);
              };
          }, [draggingLine, hoveredWomanId, treeZoom]);

          // التجوال في المشجرة بالإمساك بالخلفية الفارغة وسحبها (ماوس ولمس)
          const handlePanStart = (e) => {
              if (viewMode !== 'tree') return;
              // لا تبدأ السحب فوق عناصر تفاعلية (بطاقات، أزرار، حقول، الصور)
              // ملاحظة: closest() يشمل الأسلاف، والحاوية نفسها تحمل cursor-grab لذا نستثني الحاوية صراحة
              const container0 = treeContainerRef.current;
              if (e.target.closest('button, input, select, textarea, a, img')) return;
              const cpEl = e.target.closest('.cursor-pointer');
              if (cpEl && cpEl !== container0) return;
              const cgEl = e.target.closest('.cursor-grab');
              if (cgEl && cgEl !== container0) return;
              const container = treeContainerRef.current;
              if (!container) return;
              panState.current = {
                  pointerId: e.pointerId,
                  startX: e.clientX,
                  startY: e.clientY,
                  startScrollLeft: container.scrollLeft,
                  startScrollTop: container.scrollTop
              };
              setIsPanning(true);
              try { container.setPointerCapture(e.pointerId); } catch (err) {}
          };

          const handlePanMove = (e) => {
              if (!panState.current || panState.current.pointerId !== e.pointerId) return;
              const container = treeContainerRef.current;
              if (!container) return;
              const dx = e.clientX - panState.current.startX;
              const dy = e.clientY - panState.current.startY;
              container.scrollLeft = panState.current.startScrollLeft - dx;
              container.scrollTop = panState.current.startScrollTop - dy;
              // إبقاء خطوط الزواج ملاصقة أثناء السحب لأن طبقة الخطوط تحوّل الإحداثيات يدويًا
              if (!panRaf.current) {
                  panRaf.current = requestAnimationFrame(() => {
                      panRaf.current = null;
                      recomputeMotherConnectorLines();
                  });
              }
          };

          const handlePanEnd = (e) => {
              if (!panState.current) return;
              if (e.pointerId !== undefined && panState.current.pointerId !== e.pointerId) return;
              panState.current = null;
              setIsPanning(false);
              recomputeMotherConnectorLines();
          };

          // عجلة الماوس = تكبير/تصغير مرسّك عند مؤشر الفأرة (على الكمبيوتر)
          const treeZoomRef = useRef(1);
          useEffect(() => { treeZoomRef.current = treeZoom; }, [treeZoom]);

          const handleWheelZoom = useCallback((e) => {
              if (viewMode !== 'tree') return;
              const container = treeContainerRef.current;
              if (!container) return;
              e.preventDefault();
              e.stopPropagation();
              const z = treeZoomRef.current || 1;
              const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
              const nz = Math.min(1.5, Math.max(0.5, +(z * factor).toFixed(2)));
              if (Math.abs(nz - z) < 0.001) return;
              const rect = container.getBoundingClientRect();
              const cx = e.clientX;
              const cy = e.clientY;
              const contentX = (cx - rect.left) / z + Math.max(0, container.scrollLeft);
              const contentY = (cy - rect.top) / z + Math.max(0, container.scrollTop);
              setTreeZoom(nz);
              requestAnimationFrame(() => {
                  const c = treeContainerRef.current;
                  if (!c) return;
                  c.scrollLeft = Math.max(0, contentX - (cx - rect.left) / nz);
                  c.scrollTop = Math.max(0, contentY - (cy - rect.top) / nz);
              });
          }, [viewMode]);

          // ربط مباشر بأحداث المتصفح الأصلية لضمان عمل السحب في كل الظروف
          useEffect(() => {
              const container = treeContainerRef.current;
              if (!container || viewMode !== 'tree') return;
              container.addEventListener('pointerdown', handlePanStart);
              container.addEventListener('pointermove', handlePanMove);
              container.addEventListener('pointerup', handlePanEnd);
              container.addEventListener('pointercancel', handlePanEnd);
              container.addEventListener('wheel', handleWheelZoom, { passive: false });
              container.addEventListener('scroll', recomputeMotherConnectorLines);
              return () => {
                  container.removeEventListener('pointerdown', handlePanStart);
                  container.removeEventListener('pointermove', handlePanMove);
                  container.removeEventListener('pointerup', handlePanEnd);
                  container.removeEventListener('pointercancel', handlePanEnd);
                  container.removeEventListener('wheel', handleWheelZoom);
                  container.removeEventListener('scroll', recomputeMotherConnectorLines);
              };
          }, [viewMode, handlePanStart, handlePanMove, handlePanEnd, handleWheelZoom, recomputeMotherConnectorLines]);

          // توسيط المشجرة داخل الحاوية عند فتحها أول مرة (لتوفير مساحة سحب حرة في كل الاتجاهات)
          useEffect(() => {
              if (viewMode !== 'tree') return;
              const container = treeContainerRef.current;
              if (!container) return;
              const t = setTimeout(() => {
                  container.scrollLeft = Math.max(0, (container.scrollWidth - container.clientWidth) / 2);
                  container.scrollTop = Math.max(0, (container.scrollHeight - container.clientHeight) / 2);

              return () => clearTimeout(t);
          }, [viewMode, activeTreeSubTab]);

          const startDraggingFromAnchor = (e, fatherId, sourceMotherId) => {
              e.stopPropagation();
              e.preventDefault();
              if (!treeContainerRef.current) return;
              const clientX = e.touches ? e.touches[0].clientX : e.clientX;
              const clientY = e.touches ? e.touches[0].clientY : e.clientY;
              const rect = treeContainerRef.current.getBoundingClientRect();
              const z = treeZoom || 1;
              const x = ((clientX - rect.left) / z) + Math.max(0, treeContainerRef.current.scrollLeft);
              const y = ((clientY - rect.top) / z) + Math.max(0, treeContainerRef.current.scrollTop);

              setDraggingLine({

                  startY: y,
                  currentX: x,
                  currentY: y
              });

          const startQuiz = (specificCards = null) => {

            setQuizShowInfo(false);

          const bulkFileInputRef = useRef(null);
          const [isBulkAdding, setIsBulkAdding] = useState(false);

          const compressImageFileToBase64 = (file) => {
              return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                  const img = new window.Image();
                  img.src = event.target.result;
                  img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    const MAX_HEIGHT = 800;
                    let width = img.width;
                    let height = img.height;
                    if (width > height) {
                      if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                      if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', 0.7));
                  };
                  img.onerror = (error) => reject(error);
                };
                reader.onerror = (error) => reject(error);
              });
          };

          const handleSaveCard = async (cardData, isEdit, id, nameParts = []) => {

              const cleanParts = nameParts.map(p => p.trim()).filter(Boolean);
              const firstName = cleanParts[0] || cardData.firstName || parseNameParts(cardData.name)[0] || '';
              const fullName = cleanParts.length > 0
                  ? buildFullName(cleanParts, effectiveGender, true)
                  : (cardData.name ? `${stripClanSuffix(cardData.name)} - ${CLAN_ROOT_TITLE}` : '');

              if (cleanParts.length > 1) {
