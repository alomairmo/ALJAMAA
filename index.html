        body { font-family: 'Tajawal', sans-serif; }

        /* تنسيقات خطوط الربط الهرمية للمشجرة من الأعلى للأسفل (RTL) */
        .tree-wrapper {
            direction: rtl;
        }
        .tree ul {
            padding-top: 24px;
            position: relative;
            transition: all 0.3s;
            display: flex;
            justify-content: center;
        }
        .tree li {
            float: right;
            text-align: center;
            list-style-type: none;
            position: relative;
            padding: 24px 10px 0 10px;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* الخطوط الأفقية فوق الأبناء */
        .tree li::before, .tree li::after {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            border-top: 2px solid #cbd5e1;
            width: 50%;
            height: 24px;
        }
        .tree li::after {
            right: 50%;
            left: auto;
            border-left: 2px solid #cbd5e1;
        }
        /* إزالة الخطوط الزائدة للعقد الوحيدة أو الطرفية */
        .tree li:only-child::after, .tree li:only-child::before {
            display: none;
        }
        .tree li:only-child {
            padding-top: 0;
        }
        /* أول ابن (في أقصى اليمين في RTL) */
        .tree li:first-child::before {
            border: 0 none;
        }
        .tree li:first-child::after {
            border-radius: 0 8px 0 0;
        }
        /* آخر ابن (في أقصى اليسار في RTL) */
        .tree li:last-child::after {
            border: 0 none;
        }
        .tree li:last-child::before {
            border-left: 2px solid #cbd5e1;
            border-radius: 8px 0 0 0;
        }
        /* الخط العمودي النازل من الأب إلى خط الأبناء */
        .tree ul ul::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            border-left: 2px solid #cbd5e1;
            width: 0;
            height: 24px;
        }
        /* تحسين شريط التمرير */
        .custom-scrollbar::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>

        // مكون موحد لعرض صورة الشخص بإطار الجنس المناسب (مربع أزرق للذكر / دائري وردي للأنثى)

        // دوال مساعدة لتحليل ودمج سلاسل الأسماء العربية والتعرف التلقائي على الجنس عبر "بن" و"بنت"
        const stripClanSuffix = (fullName) => {
            if (!fullName) return '';
            return fullName.replace(/\s*-\s*آل السعيدي\s*-\s*آل سعد\s*-\s*بلّسمر\s*$/g, '').trim();
        };

        /**
         * يكتشف الجنس تلقائياً بناءً على وجود كلمة "بنت" أو "بن" في بداية/تسلسل الاسم:
         * - إذا وُجدت "بنت" قبل الاسم الثاني (الاسم الأول بنت فلان...) -> أنثى ('female')
         * - إذا وُجدت "بن" (أو "ابن") -> ذكر ('male')
         * - وإلا يرجع إلى fallbackGender
         */
        const detectGenderFromText = (rawText, fallbackGender = 'male') => {
            if (!rawText || typeof rawText !== 'string') return fallbackGender;
            const normalized = rawText.replace(/\s+/g, ' ').trim();
            // مطابقة "بنت" أو "ابنة" كفاصل بين الاسم الأول والذي بعده
            if (/(?:^|\s)(?:بنت|ابنة)(?:\s|$)/i.test(normalized)) {
                return 'female';
            }
            // مطابقة "بن" أو "ابن" كفاصل بين الاسم الأول والذي بعده أو الثالث والذي بعده وهكذا
            if (/(?:^|\s)(?:بن|ابن)(?:\s|$)/i.test(normalized)) {
                return 'male';
            }
            return fallbackGender;
        };

        /**
         * يقسم النص العربي تلقائياً عند الكلمات الفاصلة (بن / بنت / ابن / ابنة)
         * مثلاً: "سارة بنت محمد بن علي" -> ["سارة", "محمد", "علي"]
         * مثلاً: "أحمد بن خالد بن سعيد" -> ["أحمد", "خالد", "سعيد"]
         */
        const parseNameParts = (fullName) => {
            const withoutClan = stripClanSuffix(fullName);
            if (!withoutClan) return [''];
            const splitByConnectors = withoutClan
                .replace(/\s+(?:بن|بنت|ابن|ابنة)\s+/gi, '\n')
                .split(/\n+/)
                .map(s => s.trim())
                .filter(Boolean);

            if (splitByConnectors.length > 1) {
                return splitByConnectors;
            }

            const parts = withoutClan.split(/\s+/).filter(Boolean);
            return parts.length > 0 ? parts : [''];
        };

        /**
         * يبني السلسلة الكاملة للاسم:
         * - الفاصل بعد الاسم الأول يعتمد على الجنس ("بنت" للأنثى، "بن" للذكر)
         * - الفواصل بين الأسماء اللاحقة (الثاني والذي بعده، الثالث والذي بعده وهكذا) تكون "بن"
         * - يلحق المرجع الرئيسي الموحد "آل السعيدي - آل سعد - بلّسمر" عند الطلب
         */
        const buildFullName = (parts, gender = 'male', includeClan = true) => {
            const validParts = parts.map(p => p.trim()).filter(Boolean);
            if (validParts.length === 0) return '';
            const firstConnector = gender === 'female' ? 'بنت' : 'بن';
            let personChain = validParts[0];
            for (let i = 1; i < validParts.length; i++) {
                const conn = i === 1 ? firstConnector : 'بن';
                personChain += ` ${conn} ${validParts[i]}`;
            }
            return includeClan ? `${personChain} - ${CLAN_ROOT_TITLE}` : personChain;
        };

        // --- المكون الرئيسي للتطبيق ---
        function App() {
          const [cards, setCards] = useState([]);
          const [view, setView] = useState('gallery'); // 'gallery', 'quiz', 'add', 'edit'

          // حالات Firebase
          const [user, setUser] = useState(null);

          // حالات الاختبار
          const [quizQueue, setQuizQueue] = useState([]);

          const [searchQuery, setSearchQuery] = useState('');
          const [viewMode, setViewMode] = useState('all'); // 'all', 'folders', 'tree'
          const [activeFolder, setActiveFolder] = useState(null);

          // حالات المشجرة الهرمية (تفتح المشجرة الرئيسية مباشرة، والتبويب الفرعي 'ALL' يعرض الجميع)
          const [activeTreeSubTab, setActiveTreeSubTab] = useState('ALL');
          const [newTreeTitle, setNewTreeTitle] = useState('');
          const [newTreeRootName, setNewTreeRootName] = useState('');
          const [newTreeRootGender, setNewTreeRootGender] = useState('male');
          const [showNewTreeModal, setShowNewTreeModal] = useState(false);

          // نافذة الإضافة السريعة لفرع تحت شخص في المشجرة
          const [quickBranchParent, setQuickBranchParent] = useState(null);
          const [quickBranchName, setQuickBranchName] = useState('');
          const [quickBranchGender, setQuickBranchGender] = useState('male');
          const [isSavingBranch, setIsSavingBranch] = useState(false);
          const [treeZoom, setTreeZoom] = useState(1);

          // نافذة تأكيد الحذف المخصصة (بدلاً من window.confirm)
          const [deleteConfirmCard, setDeleteConfirmCard] = useState(null);

          // إشعار مخصص بدلاً من alert()
          const [toastMessage, setToastMessage] = useState(null);
          const showNotification = (msg, type = 'info') => {
              setToastMessage({ msg, type });
              setTimeout(() => setToastMessage(null), 4000);
          };

          // خريطة سريعة للوصول لأي بطاقة عبر المعرف
          const cardsMap = useMemo(() => {
              const map = new Map();
              cards.forEach(c => map.set(c.id, c));
              return map;
          }, [cards]);

          // تهيئة تسجيل الدخول المجهول وجلب البيانات
          useEffect(() => {
            const initAuth = async () => {
              try {
                await signInAnonymously(auth);
              } catch (error) {
                console.error("Auth Error:", error);
                if (error.code === 'auth/configuration-not-found') {
                  setAuthError('يرجى تفعيل "تسجيل الدخول كمجهول" (Anonymous Auth) من لوحة تحكم Firebase.');
                } else {
                  setAuthError(error.message);
                }
                setLoadingData(false);
              }
            };
            initAuth();
            
            const unsubscribe = onAuthStateChanged(auth, setUser);
            return () => unsubscribe();
          }, []);

          useEffect(() => {
            if (!user) return;

            const unsubscribe = onSnapshot(collection(db, "flashcards"), (snapshot) => {
              const fetchedCards = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              setCards(fetchedCards);
              setLoadingData(false);
              setDbError('');
            }, (error) => {
              console.error("Firestore Error:", error);
              if (error.code === 'permission-denied') {
                setDbError('ليس لديك صلاحية قراءة أو كتابة البيانات. تأكد من تعديل قواعد Firestore.');
              } else {
                setDbError(error.message);
              }
              setLoadingData(false);
            });
            return () => unsubscribe();
          }, [user]);

          // تحديث البطاقة المختارة تلقائياً إذا تغيرت في قاعدة البيانات
          useEffect(() => {
              if (selectedCard) {
                  const updated = cards.find(c => c.id === selectedCard.id);
                  if (updated) setSelectedCard(updated);
              }
          }, [cards]);

          // معالجة البيانات للمجلدات والفلترة
          const allAvailableTags = useMemo(() => {
              return Array.from(new Set(cards.flatMap(c => c.tags || [])));
          }, [cards]);

          const filteredCards = cards.filter(card => {
            const searchLower = searchQuery.toLowerCase();
            return !searchQuery ||
              (card.name && card.name.toLowerCase().includes(searchLower)) ||
              (card.firstName && card.firstName.toLowerCase().includes(searchLower)) ||
              (card.description && card.description.toLowerCase().includes(searchLower)) ||
              (card.tags && card.tags.some(t => t.toLowerCase().includes(searchLower)));
          });

          const folders = {};
          filteredCards.forEach(card => {
            const cardTags = card.tags && card.tags.length > 0 ? card.tags : ['بدون تصنيف'];
            cardTags.forEach(tag => {
              if (!folders[tag]) folders[tag] = [];
              folders[tag].push(card);
            });
          });

          // استخراج سلسلة النسب الكاملة لأي بطاقة في المشجرة (من الشخص صعوداً إلى الجد الأعلى)
          const getLineageChain = (card, allCardsMap) => {
              const chain = [];
              let current = card;
              const visited = new Set();
              while (current && !visited.has(current.id)) {
                  visited.add(current.id);
                  const fName = current.firstName || parseNameParts(current.name)[0] || '';
                  if (fName) chain.push(fName);
                  current = current.parentId ? allCardsMap.get(current.parentId) : null;
              }
              if (chain.length <= 1 && card?.name) {
                  const parsed = parseNameParts(card.name);
                  if (parsed.length > 1) return parsed;
              }
              return chain;
          };

          // الجنس الفعلي للبطاقة مع مراعاة الكشف التلقائي من الاسم إذا لم يكن محدداً
          const getEffectiveGender = (card) => {
              if (!card) return 'male';
              return detectGenderFromText(card.name || '', card.gender || 'male');
          };

          // الاسم الكامل المعروض للبطاقة متصلاً دائماً بـ "آل السعيدي - آل سعد - بلّسمر"
          const getDisplayFullName = (card) => {
              if (!card) return 'بدون اسم';
              const chain = getLineageChain(card, cardsMap);
              const gender = getEffectiveGender(card);
              if (chain.length > 0 && chain[0]) {
                  return buildFullName(chain, gender, true);
              }
              const base = stripClanSuffix(card.name);
              return base ? `${base} - ${CLAN_ROOT_TITLE}` : CLAN_ROOT_TITLE;
          };

          // دوال الاختبار
          const startQuiz = (specificCards = null) => {
            const cardsToQuiz = specificCards || (filteredCards.length > 0 ? filteredCards : []);
            if (cardsToQuiz.length === 0) {
              showNotification("لا توجد بطاقات لبدء الاختبار.", "error");
              return;
            }
            const shuffledCards = [...cardsToQuiz].sort(() => Math.random() - 0.5);
            setQuizQueue(shuffledCards);
            setQuizShowInfo(false);
            setView('quiz');
          };

          const handleCorrect = async () => {
            const currentCard = quizQueue[0];
            try {
              await updateDoc(doc(db, "flashcards", currentCard.id), {
                correctCount: (currentCard.correctCount || 0) + 1
              });
            } catch (error) {
              console.error("Error updating correct count:", error);
            }
            const newQueue = [...quizQueue];
            newQueue.shift();
            setQuizQueue(newQueue);
            setQuizShowInfo(false);
          };

          const handleWrong = async () => {
            const currentCard = quizQueue[0];
            try {
              await updateDoc(doc(db, "flashcards", currentCard.id), {
                wrongCount: (currentCard.wrongCount || 0) + 1
              });
            } catch (error) {
              console.error("Error updating wrong count:", error);
            }
            const newQueue = [...quizQueue];
            newQueue.shift();
            const insertIndex = Math.min(3, newQueue.length);
            newQueue.splice(insertIndex, 0, currentCard);
            setQuizQueue(newQueue);
            setQuizShowInfo(false);
          };

          // حفظ أو تعديل بطاقة مع دعم تسلسل النسب والربط التلقائي بالمشجرة والجذر الرئيسي
          const handleSaveCard = async (cardData, isEdit, id, nameParts = []) => {
            try {
              let resolvedParentId = cardData.parentId || null;
              let resolvedTags = [...(cardData.tags || [])];

              if (activeTreeSubTab !== 'ALL' && !resolvedTags.includes(activeTreeSubTab)) {
                  resolvedTags.push(activeTreeSubTab);
              }

              const effectiveGender = detectGenderFromText(cardData.name || '', cardData.gender || 'male');
              const cleanParts = nameParts.map(p => p.trim()).filter(Boolean);
              const firstName = cleanParts[0] || cardData.firstName || parseNameParts(cardData.name)[0] || '';
              const fullName = cleanParts.length > 0
                  ? buildFullName(cleanParts, effectiveGender, true)
                  : (cardData.name ? `${stripClanSuffix(cardData.name)} - ${CLAN_ROOT_TITLE}` : '');

              // البحث عن مطابقة لسلسلة الآباء في المشجرة الموجودة (بدءاً من الاسم الثاني)
              if (cleanParts.length > 1) {
                  const ancestorSequence = cleanParts.slice(1);
                  
                  let matchedParent = null;
                  for (const candidate of cards) {
                      if (isEdit && candidate.id === id) continue;
                      const candidateChain = getLineageChain(candidate, cardsMap);
                      const isMatch = ancestorSequence.every((part, idx) => 
                          candidateChain[idx] && candidateChain[idx].trim() === part
                      );
                      if (isMatch && candidateChain.length >= ancestorSequence.length) {
                          matchedParent = candidate;
                          break;
                      }
                  }

                  if (matchedParent) {
                      resolvedParentId = matchedParent.id;
                      if (matchedParent.tags && matchedParent.tags.length > 0) {
                          matchedParent.tags.forEach(t => {
                              if (!resolvedTags.includes(t)) resolvedTags.push(t);
                          });
                      }
                  } else {
                      // لم يوجد تسلسل مطابق: إنشاء العقد الأبوية المفقودة من الأعلى للأسفل تحت الجذر الرئيسي
                      let currentParentId = null;
                      for (let i = cleanParts.length - 1; i >= 1; i--) {
                          const ancestorFirst = cleanParts[i];
                          const subChain = cleanParts.slice(i);
                          const existingAncestor = cards.find(c => 
                              (!isEdit || c.id !== id) &&
                              (c.firstName === ancestorFirst || parseNameParts(c.name)[0] === ancestorFirst) &&
                              (c.parentId || null) === currentParentId
                          );

                          if (existingAncestor) {
                              currentParentId = existingAncestor.id;
                          } else {
                              const newAncestorRef = doc(collection(db, "flashcards"));
                              await setDoc(newAncestorRef, {
                                  name: buildFullName(subChain, 'male', true),
                                  firstName: ancestorFirst,
                                  gender: 'male',
                                  parentId: currentParentId,
                                  tags: resolvedTags,
                                  description: '',
                                  image: '',
                                  correctCount: 0,
                                  wrongCount: 0,
                                  userId: user?.uid || 'anonymous'
                              });
                              currentParentId = newAncestorRef.id;
                          }
                      }
                      resolvedParentId = currentParentId;
                  }
              }

              const finalPayload = {
                  ...cardData,
                  name: fullName,
                  firstName: firstName,
                  gender: effectiveGender,
                  parentId: resolvedParentId,
                  tags: resolvedTags
              };

              if (isEdit) {
                await updateDoc(doc(db, "flashcards", id), finalPayload);
                showNotification("تم حفظ التعديلات بنجاح", "success");
              } else {
                const newDocRef = doc(collection(db, "flashcards"));
                await setDoc(newDocRef, { 
                  ...finalPayload, 
                  correctCount: 0, 
                  wrongCount: 0,
                  userId: user?.uid || 'anonymous'
                });
                showNotification("تمت إضافة البطاقة وربطها بمشجرة آل السعيدي بنجاح", "success");
              }
              setView('gallery');
              setEditingCard(null);
            } catch (error) {
              console.error("Error saving card:", error);
              showNotification("حدث خطأ أثناء الحفظ. تأكد من صلاحيات Firestore.", "error");
            }
          };

          const executeDeleteCard = async (id) => {
            try {
              const children = cards.filter(c => c.parentId === id);
              for (const child of children) {
                  await updateDoc(doc(db, "flashcards", child.id), { parentId: null });
              }
              await deleteDoc(doc(db, "flashcards", id));
              setDeleteConfirmCard(null);
              setSelectedCard(null);
              showNotification("تم حذف البطاقة بنجاح", "success");
            } catch (error) {
              console.error("Error deleting card:", error);
              showNotification("حدث خطأ أثناء الحذف", "error");
            }
          };

          const handleEditCard = (card) => {
            setEditingCard(card);
            setSelectedCard(null);
            setView('edit');
          };

          // إنشاء فرع مجلد جديد تحت المشجرة الرئيسية (آل السعيدي - آل سعد - بلّسمر)
          const handleCreateNewTree = async (e) => {
              e.preventDefault();
              const title = newTreeTitle.trim();
              const rootName = newTreeRootName.trim();
              if (!title || !rootName) {
                  showNotification("يرجى إدخال اسم الفرع/المجلد واسم الجد الأول", "error");
                  return;
              }
              try {
                  const detectedGender = detectGenderFromText(rootName, newTreeRootGender);
                  const parts = parseNameParts(rootName);
                  const firstName = parts[0] || rootName;
                  const newRootRef = doc(collection(db, "flashcards"));
                  await setDoc(newRootRef, {
                      name: buildFullName(parts, detectedGender, true),
                      firstName,
                      gender: detectedGender,
                      parentId: null,
                      tags: [title],
                      description: '',
                      image: '',
                      correctCount: 0,
                      wrongCount: 0,
                      userId: user?.uid || 'anonymous'
                  });
                  setNewTreeTitle('');
                  setNewTreeRootName('');
                  setNewTreeRootGender('male');
                  setShowNewTreeModal(false);
                  setActiveTreeSubTab(title);
                  showNotification(`تم إنشاء فرع "${title}" تحت ${CLAN_ROOT_TITLE}`, "success");
              } catch (err) {
                  console.error(err);
                  showNotification("حدث خطأ أثناء إنشاء الفرع", "error");
              }
          };

          // إضافة فرع (ابن/بنت) سريع تحت شخص في المشجرة
          const handleAddQuickBranch = async (e) => {
              e.preventDefault();
              const rawInput = quickBranchName.trim();
              if (!rawInput || !quickBranchParent) {
                  showNotification("يرجى كتابة الاسم للفرع الجديد", "error");
                  return;
              }
              setIsSavingBranch(true);
              try {
                  const detectedGender = detectGenderFromText(rawInput, quickBranchGender);
                  const parsedInput = parseNameParts(rawInput);
                  const childFirst = parsedInput[0] || rawInput;
                  const parentChain = getLineageChain(quickBranchParent, cardsMap);
                  const fullChain = [childFirst, ...parentChain];
                  const fullName = buildFullName(fullChain, detectedGender, true);
                  const parentTags = quickBranchParent.tags && quickBranchParent.tags.length > 0
                      ? [...quickBranchParent.tags]
                      : (activeTreeSubTab !== 'ALL' ? [activeTreeSubTab] : []);

                  const newChildRef = doc(collection(db, "flashcards"));
                  await setDoc(newChildRef, {
                      name: fullName,
                      firstName: childFirst,
                      gender: detectedGender,
                      parentId: quickBranchParent.id,
                      tags: parentTags,
                      description: '',
                      image: '',
                      correctCount: 0,
                      wrongCount: 0,
                      userId: user?.uid || 'anonymous'
                  });

                  setQuickBranchName('');
                  setQuickBranchGender('male');
                  setQuickBranchParent(null);
                  showNotification(`تمت إضافة "${childFirst}" (${detectedGender === 'female' ? 'أنثى - بنت' : 'ذكر - بن'}) كفرع في المشجرة`, "success");
              } catch (err) {
                  console.error(err);
                  showNotification("حدث خطأ أثناء إضافة الفرع", "error");
              } finally {
                  setIsSavingBranch(false);
              }
          };

          // --- مكون نموذج إضافة/تعديل بطاقة مع التعرف التلقائي على فواصل "بن" و"بنت" والجنس ---
          const CardFormView = ({ initialData, onSave }) => {
            const isEdit = !!initialData;
            
            const initialParts = useMemo(() => {
                if (!initialData) return ['', '', ''];
                const chain = getLineageChain(initialData, cardsMap);
                return chain.length >= 2 ? chain : [...chain, '', ''];
            }, [initialData]);

            const [nameParts, setNameParts] = useState(initialParts);
            const [gender, setGender] = useState(initialData ? getEffectiveGender(initialData) : 'male');
            const [genderLockedByUser, setGenderLockedByUser] = useState(false);
            const [description, setDescription] = useState(initialData?.description || '');
            const [image, setImage] = useState(initialData?.image || '');
            const [imageFile, setImageFile] = useState(null);
            const [isUploading, setIsUploading] = useState(false);
            const [tags, setTags] = useState(
                initialData?.tags || (activeTreeSubTab !== 'ALL' ? [activeTreeSubTab] : [])
            );
            const [tagInput, setTagInput] = useState('');
            const [focusedPartIndex, setFocusedPartIndex] = useState(null);
            const [autoSplitNotice, setAutoSplitNotice] = useState('');

            // دالة تعالج النص عند كتابة عبارة مثل "فاطمة بنت سعد بن علي" أو "سالم بن راشد بن حمد"
            const applySmartNameParsing = (rawVal, slotIndex) => {
                const hasExplicitConnector = /\s+(?:بن|بنت|ابن|ابنة)(?:\s+|$)/i.test(rawVal);
                if (hasExplicitConnector) {
                    const detected = detectGenderFromText(rawVal, gender);
                    const splitParts = parseNameParts(rawVal);
                    const prefix = nameParts.slice(0, slotIndex).map(p => p.trim()).filter(Boolean);
                    const merged = [...prefix, ...splitParts];
                    setNameParts(merged.length > 0 ? merged : ['']);
                    if (!genderLockedByUser) {
                        setGender(detected);
                    }
                    setAutoSplitNotice(
                        `تم الفصل التلقائي عند "${detected === 'female' ? 'بنت' : 'بن'}" وتحديد الجنس: ${detected === 'female' ? 'أنثى' : 'ذكر'}`
                    );
                    return true;
                }
                return false;
            };

            const handleGenderSelect = (selectedGender) => {
                setGender(selectedGender);
                setGenderLockedByUser(true);
            };

            const existingLineages = useMemo(() => {
                return cards.map(c => ({
                    card: c,
                    chain: getLineageChain(c, cardsMap),
                    fullName: c.name || ''
                })).filter(item => item.chain.length > 0);
            }, [cards]);

            const autocompleteSuggestions = useMemo(() => {
                if (focusedPartIndex === null || focusedPartIndex === 0) return [];
                const currentTyped = (nameParts[focusedPartIndex] || '').trim();
                if (!currentTyped) return [];

                const matches = [];
                const seenKeys = new Set();

                existingLineages.forEach(({ card, chain }) => {
                    if (isEdit && card.id === initialData.id) return;
                    if (chain[0] && chain[0].includes(currentTyped)) {
                        const key = chain.join('-');
                        if (!seenKeys.has(key)) {
                            seenKeys.add(key);
                            matches.push({ card, chain });
                        }
                    }
                });
                return matches.slice(0, 6);
            }, [focusedPartIndex, nameParts, existingLineages]);

            const matchedAncestorCard = useMemo(() => {
                const ancestorSeq = nameParts.slice(1).map(p => p.trim()).filter(Boolean);
                if (ancestorSeq.length === 0) return null;
                for (const { card, chain } of existingLineages) {
                    if (isEdit && card.id === initialData.id) continue;
                    const isMatch = ancestorSeq.every((part, idx) => chain[idx] === part);
                    if (isMatch && chain.length >= ancestorSeq.length) {
                        return card;
                    }
                }
                return null;
            }, [nameParts, existingLineages]);

            const handlePartChange = (index, value) => {
                if (applySmartNameParsing(value, index)) {
                    return;
                }
                const updated = [...nameParts];
                updated[index] = value;
                setNameParts(updated);
            };

            const handleSelectAutocomplete = (index, selectedChain) => {
                const prefix = nameParts.slice(0, index);
                const merged = [...prefix, ...selectedChain];
                setNameParts(merged);
                setFocusedPartIndex(null);

                const matchedNode = existingLineages.find(l => l.chain.join('-') === selectedChain.join('-'))?.card;
                if (matchedNode?.tags?.length > 0) {
                    const newTags = Array.from(new Set([...tags, ...matchedNode.tags]));
                    setTags(newTags);
                }
            };

            const handleAddNameSlot = () => {
                setNameParts([...nameParts, '']);
            };

            const handleRemoveNameSlot = (idx) => {
                if (nameParts.length <= 1) return;
                setNameParts(nameParts.filter((_, i) => i !== idx));
            };

            const handleImageUpload = (e) => {
              const file = e.target.files[0];
              if (file) {
                setImageFile(file);
                const url = URL.createObjectURL(file);
                setImage(url);
              }
            };

            const handlePaste = (e) => {
              const items = e.clipboardData?.items;
              if (!items) return;
              for (let i = 0; i < items.length; i++) {
                if (items[i].type.indexOf('image') !== -1) {
                  const file = items[i].getAsFile();
                  if (file) {
                    setImageFile(file);
                    const url = URL.createObjectURL(file);
                    setImage(url);
                  }
                  break;
                }
              }
            };

            const handleAddTag = (e) => {
              if (e.key === 'Enter') {
                e.preventDefault();
                const val = tagInput.trim();
                if (val && !tags.includes(val)) {
                  setTags([...tags, val]);
                }
                setTagInput('');
              }
            };

            const handleRemoveTag = (tagToRemove) => {
              setTags(tags.filter(t => t !== tagToRemove));
            };

            const compressImageToBase64 = (file) => {
              return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                  const img = new window.Image();
                  img.src = event.target.result;
                  img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    const MAX_HEIGHT = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                      if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                      if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                    resolve(dataUrl);
                  };
                  img.onerror = (error) => reject(error);
                };
                reader.onerror = (error) => reject(error);
              });
            };

            const handleSave = async (e) => {
              e.preventDefault();
              const hasAnyName = nameParts.some(p => p.trim() !== '');
              if (!hasAnyName && !image && !description && !imageFile) {
                showNotification("الرجاء تعبئة حقل واحد على الأقل (الاسم، الصورة، أو الوصف)!", "error");
                return;
              }
              
              setIsUploading(true);
              let finalImageUrl = image;

              try {
                if (imageFile) {
                  finalImageUrl = await compressImageToBase64(imageFile);
                }
                const fullName = buildFullName(nameParts, gender, true);
                await onSave(
                    { 
                        name: fullName, 
                        firstName: nameParts[0]?.trim() || '',
                        gender,
                        description, 
                        image: finalImageUrl, 
                        tags,
                        parentId: initialData?.parentId || null
                    }, 
                    isEdit, 
                    initialData?.id,
                    nameParts
                );
              } catch (error) {
                console.error("Error processing image:", error);
                showNotification("حدث خطأ أثناء حفظ الصورة.", "error");
              } finally {
                setIsUploading(false);
              }
            };

            const previewFullName = buildFullName(nameParts, gender, true);

            return (
              <div onPaste={handlePaste} className="max-w-2xl mx-auto bg-white p-6 sm:p-8 rounded-3xl shadow-sm border border-gray-100 animate-in slide-in-from-bottom-4 mt-4 sm:mt-8">
                <div className="flex items-center justify-between mb-6">
                  <h2 className="text-2xl font-bold text-gray-800 flex items-center gap-3">
                    <span className="bg-blue-100 text-blue-600 p-2 rounded-xl">
                      {isEdit ? <Edit size={24} /> : <Plus size={24} />}
                    </span>
                    {isEdit ? 'تعديل البطاقة' : 'إضافة بطاقة جديدة'}
                  </h2>
                  <button onClick={() => { setView('gallery'); setEditingCard(null); }} className="text-gray-500 hover:text-gray-800 flex items-center gap-2 bg-gray-50 px-4 py-2 rounded-xl transition">
                    عودة <ChevronRight size={18} />
                  </button>
                </div>

                <form onSubmit={handleSave} className="space-y-6">
                  {/* اختيار الجنس */}
                  <div>
                    <label className="block text-gray-700 font-bold mb-2">الجنس (يُحدد تلقائياً عند كتابة "بن" أو "بنت")</label>
                    <div className="grid grid-cols-2 gap-4">
                      <button
                        type="button"
                        onClick={() => handleGenderSelect('male')}
                        className={`p-3.5 rounded-2xl border-2 flex items-center gap-3 transition ${
                          gender === 'male'
                            ? 'border-sky-500 bg-sky-50/80 text-sky-900 shadow-sm'
                            : 'border-gray-200 bg-gray-50 text-gray-600 hover:bg-gray-100'
                        }`}
                      >
                        <div className="w-12 h-12 rounded-xl bg-sky-100 border-2 border-sky-300 overflow-hidden shrink-0">
                          <MaleDefaultAvatar />
                        </div>
                        <div className="text-right">
                          <div className="font-bold text-base">ذكر (بن)</div>
                          <div className="text-xs text-sky-600">مربع أزرق (زي جنوبي وبندقية)</div>
                        </div>
                      </button>

                      <button
                        type="button"
                        onClick={() => handleGenderSelect('female')}
                        className={`p-3.5 rounded-2xl border-2 flex items-center gap-3 transition ${
                          gender === 'female'
                            ? 'border-pink-500 bg-pink-50/80 text-pink-900 shadow-sm'
                            : 'border-gray-200 bg-gray-50 text-gray-600 hover:bg-gray-100'
                        }`}
                      >
                        <div className="w-12 h-12 rounded-full bg-pink-100 border-2 border-pink-300 overflow-hidden shrink-0">
                          <AsiriWomanAvatar />
                        </div>
                        <div className="text-right">
                          <div className="font-bold text-base">أنثى (بنت)</div>
                          <div className="text-xs text-pink-600">دائري وردي (لبس عسيري)</div>
                        </div>
                      </button>
                    </div>
                  </div>

                  {/* تسلسل الأسماء (الاسم الأول - الاسم الثاني - الاسم الثالث...) مع التعرف التلقائي على (بن) و(بنت) */}
                  <div className="bg-gray-50/80 p-4 rounded-2xl border border-gray-200">
                    <div className="flex items-center justify-between mb-2">
                      <label className="text-gray-800 font-bold flex items-center gap-2">
                        <GitFork size={18} className="text-blue-600" />
                        تسلسل الاسم (الاسم الأول - الثاني - الثالث...)
                      </label>
                      <button
                        type="button"
                        onClick={handleAddNameSlot}
                        className="text-xs bg-blue-100 text-blue-700 hover:bg-blue-200 px-3 py-1.5 rounded-lg font-bold flex items-center gap-1 transition"
                      >
                        <Plus size={14} /> إضافة اسم أب/جد
                      </button>
                    </div>
                    <p className="text-xs text-gray-500 mb-3">
                      يمكنك كتابة الاسم كاملاً مثل <span className="font-bold text-gray-700">"نورة بنت محمد بن سعيد"</span> أو <span className="font-bold text-gray-700">"فهد بن سعد بن علي"</span> وسيتم فصله تلقائياً وتحديد الجنس.
                    </p>

                    {autoSplitNotice && (
                      <div className="mb-3 bg-indigo-50 border border-indigo-200 text-indigo-800 text-xs font-bold px-3 py-2 rounded-xl flex items-center justify-between">
                        <span className="flex items-center gap-1.5"><Sparkles size={14} className="text-indigo-600" /> {autoSplitNotice}</span>
                        <button type="button" onClick={() => setAutoSplitNotice('')} className="text-indigo-400 hover:text-indigo-700">
                          <X size={14} />
                        </button>
                      </div>
                    )}

                    <div className="flex flex-wrap items-center gap-2 relative">
                      {nameParts.map((part, idx) => (
                        <React.Fragment key={idx}>
                          {idx > 0 && (
                            <span className={`text-xs font-black px-2 py-0.5 rounded-md ${
                              idx === 1 && gender === 'female'
                                ? 'bg-pink-100 text-pink-700'
                                : 'bg-sky-100 text-sky-700'
                            }`}>
                              {idx === 1 ? (gender === 'female' ? 'بنت' : 'بن') : 'بن'}
                            </span>
                          )}
                          <div className="relative flex-1 min-w-[110px]">
                            <input
                              type="text"
                              value={part}
                              onFocus={() => setFocusedPartIndex(idx)}
                              onBlur={() => setTimeout(() => setFocusedPartIndex(null), 200)}
                              onChange={(e) => handlePartChange(idx, e.target.value)}
                              placeholder={
                                idx === 0 ? 'الاسم الأول' :
                                idx === 1 ? 'الاسم الثاني (الأب)' :
                                idx === 2 ? 'الاسم الثالث (الجد)' : `الاسم ${idx + 1}`
                              }
                              className={`w-full border rounded-xl px-3 py-2.5 text-sm font-bold focus:outline-none focus:ring-2 transition ${
                                idx === 0
                                  ? 'border-blue-300 bg-white focus:ring-blue-500 text-gray-900'
                                  : 'border-gray-200 bg-white focus:ring-indigo-500 text-gray-700'
                              }`}
                            />
                            {idx > 1 && (
                              <button
                                type="button"
                                onClick={() => handleRemoveNameSlot(idx)}
                                className="absolute left-1.5 top-1/2 -translate-y-1/2 text-gray-300 hover:text-red-500 p-0.5"
                                title="حذف هذه الخانة"
                              >
                                <X size={14} />
                              </button>
                            )}

                            {/* قائمة الإكمال التلقائي من المشجرة */}
                            {focusedPartIndex === idx && autocompleteSuggestions.length > 0 && (
                              <div className="absolute z-30 right-0 mt-1 w-64 bg-white rounded-2xl shadow-xl border border-blue-100 overflow-hidden animate-in fade-in">
                                <div className="bg-blue-50 px-3 py-1.5 text-[11px] font-bold text-blue-700 flex items-center gap-1">
                                  <Sparkles size={12} /> تسلسلات موجودة في المشجرة:
                                </div>
                                {autocompleteSuggestions.map(({ card, chain }) => (
                                  <button
                                    key={card.id}
                                    type="button"
                                    onMouseDown={() => handleSelectAutocomplete(idx, chain)}
                                    className="w-full text-right px-3 py-2.5 hover:bg-blue-50/70 transition border-b border-gray-50 last:border-0 flex items-center justify-between gap-2"
                                  >
                                    <div>
                                      <div className="text-sm font-bold text-gray-800">{chain.join(' بن ')}</div>
                                      {card.tags?.[0] && (
                                        <span className="text-[10px] text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full">
                                          فرع: {card.tags[0]}
                                        </span>
                                      )}
                                    </div>
                                    <ChevronRight size={14} className="text-gray-400 rotate-180" />
                                  </button>
                                ))}
                              </div>
                            )}
                          </div>
                        </React.Fragment>
                      ))}
                    </div>

                    {previewFullName && (
                      <div className="mt-3 pt-3 border-t border-gray-200/80 flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs">
                        <div className="text-gray-600">
                          الاسم الكامل في البطاقة: <span className="font-black text-gray-900 text-sm">{previewFullName}</span>
                        </div>
                        {nameParts.slice(1).some(p => p.trim()) && (
                          matchedAncestorCard ? (
                            <span className="bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full font-bold inline-flex items-center gap-1 w-fit">
                              <Check size={12} /> سيرتبط تلقائياً كفرع لـ ({matchedAncestorCard.firstName || parseNameParts(matchedAncestorCard.name)[0]})
                            </span>
                          ) : (
                            <span className="bg-amber-100 text-amber-800 px-2.5 py-1 rounded-full font-bold inline-flex items-center gap-1 w-fit">
                              <GitFork size={12} /> سينشئ تسلسل جديد تحت {CLAN_ROOT_TITLE}
                            </span>
                          )
                        )}
                      </div>
                    )}
                  </div>

                  <div>
                    <label className="block text-gray-700 font-bold mb-2">التصنيفات (المجلدات / تبويبات المشجرة)</label>
                    <div className="w-full border border-gray-200 rounded-xl p-3 focus-within:ring-2 focus-within:ring-blue-500 focus-within:border-transparent transition bg-gray-50 focus-within:bg-white">
                      <div className="flex flex-wrap gap-2 mb-2">
                        {tags.map(tag => (
                          <span key={tag} className="bg-blue-100 text-blue-700 px-3 py-1 rounded-full flex items-center gap-1.5 text-sm font-medium">
                            {tag} 
                            <X size={14} className="cursor-pointer hover:text-red-500 transition" onClick={() => handleRemoveTag(tag)} />
                          </span>
                        ))}
                      </div>
                      <input 
                        type="text" 
                        value={tagInput}
                        onChange={(e) => setTagInput(e.target.value)}
                        onKeyDown={handleAddTag}
                        list="existing-tags-list"
                        className="w-full bg-transparent outline-none placeholder-gray-400 mt-1"
                        placeholder="اكتب اسم المجلد أو الفرع واضغط Enter..."
                      />
                      <datalist id="existing-tags-list">
                        {allAvailableTags.map(t => <option key={t} value={t} />)}
                      </datalist>
                    </div>
                  </div>

                  <div>
                    <label className="block text-gray-700 font-bold mb-2">الصورة (اختياري - تظهر صورة تراثية موحدة حسب الجنس)</label>
                    <div className="flex flex-col gap-4">
                      <input 
                        type="url" 
                        value={image}
                        onChange={(e) => setImage(e.target.value)}
                        className="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition bg-gray-50 focus:bg-white text-left"
                        placeholder="https://example.com/image.jpg (أو قم برفع/لصق صورة بالأسفل)"
                        dir="ltr"
                      />
                      <div className="flex items-center justify-center w-full">
                        <label className="flex flex-col items-center justify-center w-full h-28 border-2 border-gray-300 border-dashed rounded-xl cursor-pointer bg-gray-50 hover:bg-gray-100 transition">
                          <div className="flex flex-col items-center justify-center pt-4 pb-5">
                            <ImageIcon className="w-7 h-7 mb-2 text-gray-400" />
                            <p className="text-sm text-gray-500 font-medium">اضغط لرفع صورة من جهازك أو الصقها (Ctrl+V)</p>
                          </div>
                          <input type="file" className="hidden" accept="image/*" onChange={handleImageUpload} />
                        </label>
                      </div>
                    </div>
                    <div className="mt-4 flex justify-center">
                      <PersonAvatar
                        card={{ image, gender, name: previewFullName }}
                        sizeClass="w-28 h-28"
                        imgClassName="object-contain"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-gray-700 font-bold mb-2">الوصف / المعلومات</label>
                    <textarea 
                      value={description}
                      onChange={(e) => setDescription(e.target.value)}
                      className="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition bg-gray-50 focus:bg-white h-28 resize-none"
                      placeholder="اكتب نبذة أو أي معلومات ترغب في حفظها..."
                    />
                  </div>

                  <button 
                    type="submit"
                    disabled={isUploading}
                    className="w-full bg-blue-600 text-white font-bold py-4 rounded-xl hover:bg-blue-700 transition shadow-lg shadow-blue-200 text-lg flex justify-center items-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed"
                  >
                    {isUploading ? <Loader2 className="animate-spin" size={24} /> : null}
                    {isUploading ? 'جاري معالجة البيانات والحفظ...' : (isEdit ? 'حفظ التعديلات' : 'حفظ وإضافة')}
                  </button>
                </form>
              </div>
            );
          };

          // --- مكون عقدة الشجرة الهرمية المتداخلة (Recursive Tree Node) ---
          const TreeNodeItem = ({ node, childrenMap }) => {
              const children = childrenMap.get(node.id) || [];
              const firstNameDisplay = node.firstName || parseNameParts(node.name)[0] || 'بدون اسم';
              const isFemale = getEffectiveGender(node) === 'female';

              return (
                  <li>
                      <div className="group relative flex flex-col items-center">
                          {/* بطاقة الشخص المصغرة في المشجرة (الصورة والاسم الأول فقط) */}
                          <div
                              onClick={() => { setSelectedCard(node); setGalleryShowInfo(false); }}
                              title={`عرض بطاقة: ${getDisplayFullName(node)}`}
                              className={`cursor-pointer p-2.5 rounded-2xl border-2 transition-all duration-200 shadow-sm hover:shadow-md hover:-translate-y-0.5 flex flex-col items-center min-w-[92px] max-w-[115px] bg-white ${
                                  isFemale
                                      ? 'border-pink-200 hover:border-pink-400 bg-gradient-to-b from-white to-pink-50/40'
                                      : 'border-sky-200 hover:border-sky-400 bg-gradient-to-b from-white to-sky-50/40'
                              }`}
                          >
                              <PersonAvatar card={node} sizeClass="w-14 h-14" />
                              <span className="mt-2 font-extrabold text-sm text-gray-800 truncate w-full text-center">
                                  {firstNameDisplay}
                              </span>
                          </div>

                          {/* زر إضافة فرع (ابن/بنت) تحت هذا الشخص مباشرة */}
                          <button
                              type="button"
                              onClick={(e) => {
                                  e.stopPropagation();
                                  setQuickBranchParent(node);
                                  setQuickBranchName('');
                                  setQuickBranchGender('male');
                              }}
                              title={`إضافة فرع (ابن/بنت) لـ ${firstNameDisplay}`}
                              className={`mt-1.5 w-6 h-6 rounded-full flex items-center justify-center text-white shadow-sm transition-transform hover:scale-110 active:scale-95 z-10 ${
                                  isFemale ? 'bg-pink-500 hover:bg-pink-600' : 'bg-sky-500 hover:bg-sky-600'
                              }`}
                          >
                              <Plus size={14} strokeWidth={3} />
                          </button>
                      </div>

                      {/* الأبناء والأحفاد المتفرعون للأسفل */}
                      {children.length > 0 && (
                          <ul>
                              {children.map(child => (
                                  <TreeNodeItem
                                      key={child.id}
                                      node={child}
                                      childrenMap={childrenMap}
                                  />
                              ))}
                          </ul>
                      )}
                  </li>
              );
          };

          // --- مكون عرض المشجرة الهرمية (تفتح المشجرة الرئيسية مباشرة + تبويبات فرعية للمجلدات) ---
          const renderTreeView = () => {
              const treeMembers = activeTreeSubTab === 'ALL'
                  ? filteredCards
                  : filteredCards.filter(c => (c.tags || []).includes(activeTreeSubTab));

              const memberIdsSet = new Set(treeMembers.map(m => m.id));

              const childrenMap = new Map();
              treeMembers.forEach(member => {
                  if (member.parentId && memberIdsSet.has(member.parentId)) {
                      if (!childrenMap.has(member.parentId)) childrenMap.set(member.parentId, []);
                      childrenMap.get(member.parentId).push(member);
                  }
              });

              const roots = treeMembers.filter(m => !m.parentId || !memberIdsSet.has(m.parentId));

              return (
                  <div className="animate-in fade-in duration-300">
                      {/* شريط أدوات المشجرة الرئيسية */}
                      <div className="flex flex-wrap items-center justify-between gap-4 mb-4 bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                          <div className="flex items-center gap-3">
                              <div className="bg-indigo-100 text-indigo-700 p-2.5 rounded-xl">
                                  <GitFork size={22} />
                              </div>
                              <div>
                                  <h2 className="text-lg sm:text-xl font-black text-gray-800">
                                      مشجرة {CLAN_ROOT_TITLE}
                                  </h2>
                                  <p className="text-xs text-gray-500">
                                      {activeTreeSubTab === 'ALL'
                                          ? `عرض جميع أفراد وفروع المشجرة (${treeMembers.length} فرد)`
                                          : `عرض فرع / مجلد: ${activeTreeSubTab} (${treeMembers.length} فرد)`}
                                  </p>
                              </div>
                          </div>

                          <div className="flex items-center gap-2 flex-wrap">
                              <div className="flex items-center bg-gray-100 rounded-xl p-1">
                                  <button
                                      onClick={() => setTreeZoom(z => Math.max(0.5, +(z - 0.1).toFixed(1)))}
                                      className="p-2 hover:bg-white rounded-lg text-gray-600 transition"
                                      title="تصغير"
                                  >
                                      <ZoomOut size={16} />
                                  </button>
                                  <span className="px-2 text-xs font-bold text-gray-600">{Math.round(treeZoom * 100)}%</span>
                                  <button
                                      onClick={() => setTreeZoom(z => Math.min(1.5, +(z + 0.1).toFixed(1)))}
                                      className="p-2 hover:bg-white rounded-lg text-gray-600 transition"
                                      title="تكبير"
                                  >
                                      <ZoomIn size={16} />
                                  </button>
                              </div>

                              <button
                                  onClick={() => startQuiz(treeMembers)}
                                  className="flex items-center gap-2 bg-emerald-600 text-white px-4 py-2 rounded-xl hover:bg-emerald-700 transition font-bold text-sm"
                              >
                                  <Play size={16} fill="currentColor" /> اختبار المعروض
                              </button>

                              <button
                                  onClick={() => setShowNewTreeModal(true)}
                                  className="flex items-center gap-2 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 px-4 py-2 rounded-xl transition font-bold text-sm"
                              >
                                  <Plus size={16} /> إضافة فرع/مجلد جديد
                              </button>
                          </div>
                      </div>

                      {/* شريط التبويبات الفرعية للانتقال السريع بين المشجرة الرئيسية والمجلدات */}
                      <div className="flex items-center gap-2 overflow-x-auto pb-2 mb-4 custom-scrollbar">
                          <button
                              onClick={() => setActiveTreeSubTab('ALL')}
                              className={`px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap transition flex items-center gap-2 border ${
                                  activeTreeSubTab === 'ALL'
                                      ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm'
                                      : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'
                              }`}
                          >
                              <Users size={16} /> الكل (المشجرة الرئيسية)
                              <span className={`text-xs px-2 py-0.5 rounded-full ${activeTreeSubTab === 'ALL' ? 'bg-white/20 text-white' : 'bg-gray-100 text-gray-600'}`}>
                                  {filteredCards.length}
                              </span>
                          </button>

                          {allAvailableTags.map(tag => {
                              const count = filteredCards.filter(c => (c.tags || []).includes(tag)).length;
                              const isActive = activeTreeSubTab === tag;
                              return (
                                  <button
                                      key={tag}
                                      onClick={() => setActiveTreeSubTab(tag)}
                                      className={`px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap transition flex items-center gap-2 border ${
                                          isActive
                                              ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm'
                                              : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'
                                      }`}
                                  >
                                      <Folder size={15} /> {tag}
                                      <span className={`text-xs px-2 py-0.5 rounded-full ${isActive ? 'bg-white/20 text-white' : 'bg-gray-100 text-gray-600'}`}>
                                          {count}
                                      </span>
                                  </button>
                              );
                          })}
                      </div>

                      {/* لوحة رسم الشجرة الهرمية من الأعلى للأسفل */}
                      <div className="bg-white rounded-3xl border border-gray-200 shadow-inner p-6 sm:p-10 overflow-x-auto custom-scrollbar min-h-[500px] flex justify-center items-start">
                          <div
                              className="tree-wrapper transition-transform origin-top"
                              style={{ transform: `scale(${treeZoom})` }}
                          >
                              <div className="tree">
                                  <ul>
                                      {/* العقدة الجذرية العليا الموحدة لجميع أفراد وفروع الشجرة */}
                                      <li>
                                          <div className="flex flex-col items-center">
                                              <div className="bg-gradient-to-l from-indigo-900 via-blue-900 to-indigo-800 text-white px-7 py-3.5 rounded-2xl shadow-lg border-2 border-amber-300/60 flex flex-col items-center">
                                                  <span className="text-[11px] text-amber-300 font-bold tracking-wide mb-0.5">
                                                      المرجع الرئيسي للمشجرة
                                                  </span>
                                                  <span className="text-lg sm:text-xl font-black tracking-tight">
                                                      {CLAN_ROOT_TITLE}
                                                  </span>
                                                  {activeTreeSubTab !== 'ALL' && (
                                                      <span className="mt-1 bg-white/15 text-white text-xs px-3 py-0.5 rounded-full font-bold">
                                                          فرع: {activeTreeSubTab}
                                                      </span>
                                                  )}
                                              </div>

                                              <button
                                                  type="button"
                                                  onClick={() => setView('add')}
                                                  title="إضافة فرع مباشر تحت آل السعيدي - آل سعد - بلّسمر"
                                                  className="mt-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-3 py-1 rounded-full shadow-sm flex items-center gap-1 transition"
                                              >
                                                  <Plus size={13} strokeWidth={3} /> إضافة جد / فرع
                                              </button>
                                          </div>

                                          {/* تفرع جميع الجذور والأفراد من المرجع الرئيسي إلى الأسفل */}
                                          {roots.length > 0 ? (
                                              <ul>
                                                  {roots.map(rootNode => (
                                                      <TreeNodeItem
                                                          key={rootNode.id}
                                                          node={rootNode}
                                                          childrenMap={childrenMap}
                                                      />
                                                  ))}
                                              </ul>
                                          ) : (
                                              <div className="mt-8 text-center text-gray-400 text-sm bg-gray-50 px-6 py-4 rounded-2xl border border-dashed border-gray-200">
                                                  لا يوجد أفراد في هذا التبويب بعد. اضغط على "إضافة جد / فرع" للبدء.
                                              </div>
                                          )}
                                      </li>
                                  </ul>
                              </div>
                          </div>
                      </div>

                      <div className="mt-4 flex flex-wrap items-center justify-center gap-6 text-xs text-gray-500 bg-white py-3 px-4 rounded-2xl border border-gray-100">
                          <span className="flex items-center gap-2">
                              <span className="w-4 h-4 rounded bg-sky-100 border border-sky-300 inline-block"></span> ذكر (مربع أزرق - زي جنوبي وبندقية)
                          </span>
                          <span className="flex items-center gap-2">
                              <span className="w-4 h-4 rounded-full bg-pink-100 border border-pink-300 inline-block"></span> أنثى (دائري وردي - لبس عسيري)
                          </span>
                          <span className="flex items-center gap-1.5">
                              <span className="w-4 h-4 rounded-full bg-sky-500 text-white inline-flex items-center justify-center"><Plus size={10} /></span>
                              اضغط زر الإضافة أسفل أي شخص لتفريع ابن/بنت له مباشرة
                          </span>
                      </div>
                  </div>
              );
          };

          // --- مكون المعرض ---
          const renderGallery = () => {
            if (authError || dbError) {
              return (
                <div className="flex flex-col items-center justify-center py-20 px-4 animate-in fade-in">
                  <div className="bg-red-50 text-red-700 p-8 rounded-3xl max-w-2xl text-center border border-red-200 shadow-sm">
                    <X size={56} className="mx-auto mb-4 text-red-500" strokeWidth={2.5} />
                    <h2 className="text-2xl font-bold mb-4">يوجد خطأ في إعدادات Firebase</h2>
                    {authError && <p className="text-sm">{authError}</p>}
                    {dbError && <p className="text-sm">{dbError}</p>}
                  </div>
                </div>
              );
            }

            if (loadingData) {
              return (
                <div className="flex flex-col items-center justify-center py-32 animate-in fade-in">
                  <Loader2 className="w-12 h-12 text-blue-600 animate-spin mb-4" />
                  <h2 className="text-xl text-gray-600 font-bold">جاري تحميل البطاقات...</h2>
                </div>
              );
            }

            return (
              <div className="animate-in fade-in duration-300">
                <div className="flex flex-col sm:flex-row justify-between items-center bg-white p-4 rounded-2xl shadow-sm mb-4 gap-4 border border-gray-100">
                  <div className="flex items-center gap-4 w-full sm:w-auto">
                    <button 
                      onClick={() => setView('add')}
                      className="flex items-center gap-2 bg-blue-50 text-blue-600 px-4 py-2 rounded-xl hover:bg-blue-100 transition font-medium w-full sm:w-auto justify-center"
                    >
                      <Plus size={20} /> إضافة بطاقة
                    </button>
                    {viewMode !== 'tree' && (
                      <label className="flex items-center cursor-pointer gap-3 bg-gray-50 px-4 py-2 rounded-xl border border-gray-100">
                        <div className="relative">
                          <input type="checkbox" className="sr-only" checked={showNames} onChange={() => setShowNames(!showNames)} />
                          <div className={`block w-12 h-6 rounded-full transition ${showNames ? 'bg-blue-500' : 'bg-gray-300'}`}></div>
                          <div className={`dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition transform ${showNames ? 'translate-x-6' : ''}`}></div>
                        </div>
                        <span className="text-gray-700 font-medium select-none text-sm">إظهار الأسماء</span>
                      </label>
                    )}
                  </div>
                  
                  <div className="flex flex-col sm:flex-row gap-3 w-full sm:w-auto mt-2 sm:mt-0">
                    {viewMode === 'folders' && activeFolder && (
                      <button
                        onClick={() => startQuiz(folders[activeFolder])}
                        className="flex items-center justify-center gap-2 bg-gradient-to-r from-emerald-500 to-teal-600 text-white px-6 py-3 rounded-xl hover:shadow-lg hover:from-emerald-600 hover:to-teal-700 transition font-bold text-lg w-full sm:w-auto whitespace-nowrap"
                      >
                        <Play size={24} fill="currentColor" /> الاختبار في ({activeFolder})
                      </button>

                      <div key={`info-${currentCard.id}`} className="w-full h-full flex flex-col items-center justify-center p-6 text-center animate-in fade-in zoom-in duration-300 overflow-y-auto">
                        <h3 className="text-2xl sm:text-3xl font-black text-gray-800 mb-4 leading-relaxed">{getDisplayFullName(currentCard)}</h3>
                        <p className="text-gray-600 text-lg leading-relaxed mb-4">{currentCard.description || 'لا يوجد وصف'}</p>
                      </div>
                    )}
                  </div>
                  
                  {!quizShowInfo && (
                    <div className="absolute -bottom-5 left-1/2 transform -translate-x-1/2 bg-white px-6 py-2 rounded-full shadow-md border border-gray-100 font-bold text-gray-400 text-sm tracking-widest flex items-center gap-2">
                      من هذا؟ <User size={16} />
                    </div>
                  )}
                </div>

                <div className="w-full flex flex-col items-center mt-2 px-2 gap-4">
                  <button 
                    onClick={() => setQuizShowInfo(!quizShowInfo)}
                    className="w-full bg-blue-100 text-blue-700 border-2 border-transparent hover:border-blue-200 hover:bg-blue-200 py-4 rounded-2xl transition-all duration-300 font-bold text-xl flex items-center justify-center gap-3 shadow-sm active:scale-95 animate-in fade-in"
                  >
                    <RefreshCw size={24} /> {quizShowInfo ? 'إرجاع الصورة' : 'قلب البطاقة (عرض الإجابة)'}
                  </button>

                  <div className="flex w-full gap-4 animate-in fade-in slide-in-from-bottom-4 duration-300 mt-2">
                    <button 
                      onClick={handleWrong}
                      className="flex-1 bg-red-50 text-red-600 border-2 border-red-200 hover:bg-red-600 hover:text-white py-5 rounded-2xl transition-all duration-300 font-bold text-2xl flex items-center justify-center gap-3 shadow-sm hover:shadow-red-200/50 hover:shadow-xl active:scale-95"
                    >
                      <X size={32} strokeWidth={3} /> خطأ
                    </button>
                    <button 
                      onClick={handleCorrect}
                      className="flex-1 bg-green-50 text-green-600 border-2 border-green-200 hover:bg-green-600 hover:text-white py-5 rounded-2xl transition-all duration-300 font-bold text-2xl flex items-center justify-center gap-3 shadow-sm hover:shadow-green-200/50 hover:shadow-xl active:scale-95"
                    >
                      <Check size={32} strokeWidth={3} /> صح
                    </button>
                  </div>
                </div>
              </div>
            );
          };

          return (
            <div>
              {/* إشعار عائم */}
              {toastMessage && (
                <div className={`fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] px-6 py-3.5 rounded-2xl shadow-xl font-bold text-sm flex items-center gap-2 animate-in fade-in slide-in-from-bottom-4 ${
                  toastMessage.type === 'error' ? 'bg-red-600 text-white' :
                  toastMessage.type === 'success' ? 'bg-emerald-600 text-white' : 'bg-gray-900 text-white'
                }`}>
                  {toastMessage.msg}
                </div>
              )}

              <header className="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-sm">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
                  <div className="flex items-center gap-3 cursor-pointer" onClick={() => setView('gallery')}>
                    <div className="bg-gradient-to-br from-blue-600 to-indigo-600 text-white p-2.5 rounded-xl shadow-md">
                      <ImageIcon size={28} />
                    </div>
                    <h1 className="text-2xl font-black bg-clip-text text-transparent bg-gradient-to-l from-blue-800 to-indigo-600 tracking-tight">
                      اختبار الذاكرة
                    </h1>
                  </div>
                </div>
              </header>
              <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                {view === 'gallery' && renderGallery()}
                {view === 'add' && <CardFormView onSave={handleSaveCard} />}
                {view === 'edit' && <CardFormView initialData={editingCard} onSave={handleSaveCard} />}
                {view === 'quiz' && renderQuiz()}
              </main>
            </div>
          );
        }

        // تشغيل التطبيق في الصفحة
        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
