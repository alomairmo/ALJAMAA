                  let matchedParent = null;
                  for (const candidate of cards) {
                      if (isEdit && candidate.id === id) continue;
                      const candidateChain = getLineageChain(candidate, cardsMap);
                      const isMatch = ancestorSequence.every((part, idx) => 
                          candidateChain[idx] && candidateChain[idx].trim() === part
                      );
                      if (isMatch && candidateChain.length >= ancestorSequence.length) {
                          matchedParent = candidate;
                          break;
                      }
                  }

                  if (matchedParent) {
                      resolvedParentId = matchedParent.id;
                      if (matchedParent.tags && matchedParent.tags.length > 0) {
                          matchedParent.tags.forEach(t => {
                              if (!resolvedTags.includes(t)) resolvedTags.push(t);
                          });
                      }
                  } else {
                      let currentParentId = null;
                      for (let i = cleanParts.length - 1; i >= 1; i--) {
                          const ancestorFirst = cleanParts[i];
                          const subChain = cleanParts.slice(i);
                          const existingAncestor = cards.find(c => 
                              (!isEdit || c.id !== id) &&
                              (c.firstName === ancestorFirst || parseNameParts(c.name)[0] === ancestorFirst) &&
                              (c.parentId || null) === currentParentId
                          );

                          if (existingAncestor) {
                              currentParentId = existingAncestor.id;
                          } else {
                              const newAncestorRef = doc(collection(db, "flashcards"));
                              await setDoc(newAncestorRef, {
                                  name: buildFullName(subChain, 'male', true),
                                  firstName: ancestorFirst,
                                  gender: 'male',
                                  parentId: currentParentId,
                                  tags: resolvedTags,
                                  description: '',
                                  image: '',
                                  correctCount: 0,
                                  wrongCount: 0,
                                  userId: user?.uid || 'anonymous'
                              });
                              currentParentId = newAncestorRef.id;
                          }
                      }
                      resolvedParentId = currentParentId;
                  }
              }

              let resolvedMotherId = cardData.motherId !== undefined ? cardData.motherId : null;
              if (!resolvedMotherId && resolvedParentId) {
                  const fatherObj = cardsMap.get(resolvedParentId);
                  if (fatherObj) {
                      const activeWives = getFatherMarriages(fatherObj).filter(m => m.status !== 'divorced');
                      if (activeWives.length === 1) {
                          resolvedMotherId = activeWives[0].wifeId;
                      }
                  }
              }

              const finalPayload = {
                  ...cardData,
                  name: fullName,
                  firstName: firstName,
                  gender: effectiveGender,
                  parentId: resolvedParentId,
                  motherId: resolvedMotherId || null,
                  tags: resolvedTags
              };

              if (isEdit) {
                await updateDoc(doc(db, "flashcards", id), finalPayload);
                showNotification("تم حفظ التعديلات بنجاح", "success");

                // إذا تغيّر اسم الشخص أو أسماء آبائه وله أبناء تابعون له، نعرض خيار تحديث أسمائهم ليبقوا تابعين له
                try {
                    const oldChain = getLineageChain(cardsMap.get(id) || {}, cardsMap);
                    const newChain = cleanParts.length > 1
                        ? [...cleanParts]
                        : [firstName, ...oldChain.slice(1)];
                    const lineageChanged = newChain.join('|') !== oldChain.join('|');
                    const childrenOfEdited = cards.filter(c => c.parentId === id);
                    if (lineageChanged && childrenOfEdited.length > 0) {
                        const wantsCascade = window.confirm(
                            `تم تغيير اسم "${oldChain.join(' بن ') || firstName}" وأصبح "${newChain.join(' بن ')}".\n\n` +
                            `لدى هذا الشخص ${childrenOfEdited.length} من الأبناء المرتبطين به.\n` +
                            `هل تريد تغيير أسماء الأبناء (وأحفادهم) أيضًا ليبقوا تابعين له بالاسم الجديد؟`
                        );
                        if (wantsCascade) {
                            let updatedCount = 0;
                            const updateDescendants = async (parentId, parentChain) => {
                                const kids = cards.filter(c => c.parentId === parentId);
                                for (const kid of kids) {
                                    const kidOwn = (parseNameParts(kid.name)[0] || kid.firstName || '').trim();
                                    if (!kidOwn) continue;
                                    const kidGender = getEffectiveGender(kid);
                                    const kidChain = [kidOwn, ...parentChain];
                                    const kidName = buildFullName(kidChain, kidGender, true);
                                    await updateDoc(doc(db, "flashcards", kid.id), { name: kidName, firstName: kidOwn });
                                    updatedCount++;
                                    await updateDescendants(kid.id, kidChain);
                                }
                            };
                            await updateDescendants(id, newChain);
                            showNotification(`تم تحديث أسماء ${updatedCount} من الأبناء/الأحفاد ليتابعوا الاسم الجديد`, "success");
                        }
                    }
                } catch (cascadeError) {
                    console.error("Error cascading name update:", cascadeError);
                    showNotification("تم الحفظ لكن حدث خطأ أثناء تحديث أسماء الأبناء", "error");
                }
              } else {
                const newDocRef = doc(collection(db, "flashcards"));
                await setDoc(newDocRef, { 
                  ...finalPayload, 
                  correctCount: 0, 
                  wrongCount: 0,
                  userId: user?.uid || 'anonymous'
                });
                showNotification("تمت إضافة البطاقة وربطها بمشجرة آل السعيدي بنجاح", "success");
              }
              setView('gallery');
              setEditingCard(null);
            } catch (error) {
              console.error("Error saving card:", error);
              showNotification("حدث خطأ أثناء الحفظ. تأكد من صلاحيات Firestore.", "error");
            }
          };

          const executeDeleteCard = async (id) => {
            try {
              const cardToDelete = cardsMap.get(id);
              const children = cards.filter(c => c.parentId === id);

              // إن كان له أبناء: نسأل عن حذف اسمه من عندهم ليبقوا متصلين بمن فوقه مباشرة
              let spliceChain = null;
              if (children.length > 0) {
                  const wantsSplice = window.confirm(
                      `هذا الشخص له ${children.length} من الأبناء.\n\n` +
                      `هل تريد حذف اسمه من عند الأبناء أيضًا ليبقوا متصلين بمن فوقه مباشرة؟`
                  );
                  if (wantsSplice) {
                      // سلسلة النسب لمن فوقه مباشرة (أو فارغة إن لم يكن له أب مسجل)
                      spliceChain = getLineageChain(cardToDelete || {}, cardsMap).slice(1);
                  }
              }

              if (spliceChain) {
                  const adoptiveParentId = cardToDelete?.parentId || null;
                  let updatedCount = 0;
                  const spliceDescendants = async (removedId, parentChain) => {
                      const kids = cards.filter(c => c.parentId === removedId);
                      for (const kid of kids) {
                          const kidOwn = (parseNameParts(kid.name)[0] || kid.firstName || '').trim();
                          const kidGender = getEffectiveGender(kid);
                          const kidChain = kidOwn ? [kidOwn, ...parentChain] : parentChain;
                          const kidName = kidOwn ? buildFullName(kidChain, kidGender, true) : kid.name;
                          await updateDoc(doc(db, "flashcards", kid.id), {
                              parentId: removedId === id ? adoptiveParentId : kid.parentId,
                              name: kidName,
                              firstName: kidOwn || kid.firstName
                          });
                          updatedCount++;
                          await spliceDescendants(kid.id, kidChain);
                      }
                  };
                  await spliceDescendants(id, spliceChain);
                  showNotification(`تم حذف الاسم من عند ${updatedCount} من الأبناء/الأحفاد وأصبحوا تابعين لمن فوقه مباشرة`, "success");
              } else {
                  for (const child of children) {
                      await updateDoc(doc(db, "flashcards", child.id), { parentId: null });
                  }
              }

              const maternalChildren = cards.filter(c => c.motherId === id);
              for (const child of maternalChildren) {
                  await updateDoc(doc(db, "flashcards", child.id), { motherId: null });
              }
              await deleteDoc(doc(db, "flashcards", id));
              setDeleteConfirmCard(null);
              setSelectedCard(null);
              showNotification("تم حذف البطاقة بنجاح", "success");
            } catch (error) {
              console.error("Error deleting card:", error);
              showNotification("حدث خطأ أثناء الحذف", "error");
            }
          };

          const handleEditCard = (card) => {
            setEditingCard(card);
            setSelectedCard(null);
            // يُفتح التعديل في نافذة منبثقة فوق الشاشة الحالية دون مغادرتها
          };

          const handleCreateNewTree = async (e) => {
              e.preventDefault();
              const title = newTreeTitle.trim();
              const rootName = newTreeRootName.trim();
              if (!title || !rootName) {
                  showNotification("يرجى إدخال اسم الفرع/المجلد واسم الجد الأول", "error");
                  return;
              }
              try {
                  const detectedGender = detectGenderFromText(rootName, newTreeRootGender);
                  const parts = parseNameParts(rootName);
                  const firstName = parts[0] || rootName;
                  const newRootRef = doc(collection(db, "flashcards"));
                  await setDoc(newRootRef, {
                      name: buildFullName(parts, detectedGender, true),
                      firstName,
                      gender: detectedGender,
                      parentId: null,
                      tags: [title],
                      description: '',
                      image: '',
                      correctCount: 0,
                      wrongCount: 0,
                      userId: user?.uid || 'anonymous'
                  });
                  setNewTreeTitle('');
                  setNewTreeRootName('');
                  setNewTreeRootGender('male');
                  setShowNewTreeModal(false);
                  setActiveTreeSubTab(title);
                  showNotification(`تم إنشاء فرع "${title}" تحت ${CLAN_ROOT_TITLE}`, "success");
              } catch (err) {
                  console.error(err);
                  showNotification("حدث خطأ أثناء إنشاء الفرع", "error");
              }
          };

          const closeQuickBranchModal = () => {
              setQuickBranchParent(null);
              setQuickBranchMotherId(null);
              setQuickBranchMode('choose');
              setQuickBranchSearch('');
              setQuickBranchName('');
              setQuickBranchGender('male');
          };

          const handleAddQuickBranch = async (e) => {
              e.preventDefault();
              const rawInput = quickBranchName.trim();
              if (!rawInput || !quickBranchParent) {
                  showNotification("يرجى كتابة الاسم للفرع الجديد", "error");
                  return;
              }
              setIsSavingBranch(true);
              try {
                  const detectedGender = detectGenderFromText(rawInput, quickBranchGender);
                  const parsedInput = parseNameParts(rawInput);
                  const childFirst = parsedInput[0] || rawInput;
                  const parentChain = getLineageChain(quickBranchParent, cardsMap);
                  const fullChain = [childFirst, ...parentChain];
                  const fullName = buildFullName(fullChain, detectedGender, true);
                  const parentTags = quickBranchParent.tags && quickBranchParent.tags.length > 0
                      ? [...quickBranchParent.tags]
                      : (activeTreeSubTab !== 'ALL' ? [activeTreeSubTab] : []);

                  let targetMotherId = quickBranchMotherId || null;
                  if (!targetMotherId) {
                      const activeWives = getFatherMarriages(quickBranchParent).filter(m => m.status !== 'divorced');
                      if (activeWives.length === 1) {
                          targetMotherId = activeWives[0].wifeId;
                      }
                  }

                  const newChildRef = doc(collection(db, "flashcards"));
                  await setDoc(newChildRef, {
                      name: fullName,
                      firstName: childFirst,
                      gender: detectedGender,
                      parentId: quickBranchParent.id,
                      motherId: targetMotherId,
                      tags: parentTags,
                      description: '',
                      image: '',
                      correctCount: 0,
                      wrongCount: 0,
                      userId: user?.uid || 'anonymous'
                  });

                  closeQuickBranchModal();
                  showNotification(`تمت إضافة "${childFirst}" (${detectedGender === 'female' ? 'أنثى - بنت' : 'ذكر - بن'}) كفرع في المشجرة`, "success");
              } catch (err) {
                  console.error(err);
                  showNotification("حدث خطأ أثناء إضافة الفرع", "error");
              } finally {
                  setIsSavingBranch(false);
              }
          };

          const handleAttachExistingCardAsChild = async (existingCard) => {
              if (!existingCard || !quickBranchParent) return;
              if (existingCard.id === quickBranchParent.id) {
                  showNotification("لا يمكن ربط الشخص بنفسه!", "error");
                  return;
              }

              setIsSavingBranch(true);
              try {
                  const childFirstName = (existingCard.firstName || parseNameParts(existingCard.name)[0] || '').trim();
                  const childGender = getEffectiveGender(existingCard);

                  const parentChain = getLineageChain(quickBranchParent, cardsMap);
                  const newFullChain = [childFirstName, ...parentChain];
                  const updatedFullName = buildFullName(newFullChain, childGender, true);

                  let targetMotherId = quickBranchMotherId || null;
                  if (!targetMotherId && getEffectiveGender(quickBranchParent) === 'male') {
                      const activeWives = getFatherMarriages(quickBranchParent).filter(m => m.status !== 'divorced');
                      if (activeWives.length === 1) {
                          targetMotherId = activeWives[0].wifeId;
                      }
                  }

                  const mergedTags = Array.from(new Set([
                      ...(existingCard.tags || []),
                      ...(quickBranchParent.tags || []),
                      ...(activeTreeSubTab !== 'ALL' ? [activeTreeSubTab] : [])
                  ]));

                  await updateDoc(doc(db, "flashcards", existingCard.id), {
                      firstName: childFirstName,
                      name: updatedFullName,
                      parentId: quickBranchParent.id,
                      motherId: targetMotherId,
                      parentsDivorced: false,
                      tags: mergedTags
                  });

                  const updateDescendantsLineage = async (parentNodeId, currentAncestorChain) => {
                      const directKids = cards.filter(c => c.parentId === parentNodeId);
                      for (const kid of directKids) {
                          const kidFirst = (kid.firstName || parseNameParts(kid.name)[0] || '').trim();
                          const kidGender = getEffectiveGender(kid);
                          const kidChain = [kidFirst, ...currentAncestorChain];
                          const kidUpdatedName = buildFullName(kidChain, kidGender, true);
                          await updateDoc(doc(db, "flashcards", kid.id), {
                              firstName: kidFirst,
                              name: kidUpdatedName
                          });
                          await updateDescendantsLineage(kid.id, kidChain);
                      }
                  };

                  await updateDescendantsLineage(existingCard.id, newFullChain);

                  const parentFirst = quickBranchParent.firstName || parseNameParts(quickBranchParent.name)[0];
                  closeQuickBranchModal();
                  showNotification(
                      `تم نقل "${childFirstName}" بجميع بياناته وحذف الأسماء السابقة فوق اسمه الأول ليصبح ابناً لـ "${parentFirst}"`,
                      "success"
                  );
              } catch (err) {
                  console.error("Error attaching existing card:", err);
                  showNotification("حدث خطأ أثناء نقل البطاقة الحالية", "error");
              } finally {
                  setIsSavingBranch(false);
              }
          };

          const CardFormView = ({ initialData, onSave }) => {
            const isEdit = !!initialData;
            
            const initialParts = useMemo(() => {
                if (!initialData) return ['', '', ''];
                const chain = getLineageChain(initialData, cardsMap);
                return chain.length >= 2 ? chain : [...chain, '', ''];
            }, [initialData]);

            const [nameParts, setNameParts] = useState(initialParts);
            const [gender, setGender] = useState(initialData ? getEffectiveGender(initialData) : 'male');
            const [genderLockedByUser, setGenderLockedByUser] = useState(false);
            const [motherId, setMotherId] = useState(initialData?.motherId || '');
            const [description, setDescription] = useState(initialData?.description || '');
            const [image, setImage] = useState(initialData?.image || '');
            const [imageFile, setImageFile] = useState(null);
            const [isUploading, setIsUploading] = useState(false);
            const [tags, setTags] = useState(
                initialData?.tags || (activeTreeSubTab !== 'ALL' ? [activeTreeSubTab] : [])
            );
            const [tagInput, setTagInput] = useState('');
            const [focusedPartIndex, setFocusedPartIndex] = useState(null);
            const [autoSplitNotice, setAutoSplitNotice] = useState('');
            const [fullNameText, setFullNameText] = useState(() =>
                buildFullName(initialParts, initialData ? getEffectiveGender(initialData) : 'male', false)
            );
            const [spouseQuery, setSpouseQuery] = useState('');
            const [childName, setChildName] = useState('');
            const [childMotherId, setChildMotherId] = useState('');
            const [childFatherId, setChildFatherId] = useState('');
            const [isSavingRelative, setIsSavingRelative] = useState(false);

            // نسخة حية من البطاقة المعدلة (تتغير بعد كل إضافة زوج/ابن)
            const me = isEdit ? (cardsMap.get(initialData.id) || initialData) : null;

            const femaleCards = useMemo(() => {
                return cards.filter(c => getEffectiveGender(c) === 'female' && (!isEdit || c.id !== initialData.id));
            }, [cards, isEdit, initialData]);

            const applySmartNameParsing = (rawVal, slotIndex) => {
                const hasExplicitConnector = /\s+(?:بن|بنت|ابن|ابنة)(?:\s+|$)/i.test(rawVal);
                if (hasExplicitConnector) {
                    const detected = detectGenderFromText(rawVal, gender);
                    const splitParts = parseNameParts(rawVal);
                    const prefix = nameParts.slice(0, slotIndex).map(p => p.trim()).filter(Boolean);
                    const merged = [...prefix, ...splitParts];
                    setNameParts(merged.length > 0 ? merged : ['']);
                    setFullNameText(buildFullName(merged.length > 0 ? merged : [''], detected, false));
                    if (!genderLockedByUser) {
                        setGender(detected);
                    }
                    setAutoSplitNotice(
                        `تم الفصل التلقائي عند "${detected === 'female' ? 'بنت' : 'بن'}" وتحديد الجنس: ${detected === 'female' ? 'أنثى' : 'ذكر'}`
                    );
                    return true;
                }
                return false;
            };

            const handleGenderSelect = (selectedGender) => {
                setGender(selectedGender);
                setGenderLockedByUser(true);
                setFullNameText(buildFullName(nameParts, selectedGender, false));
            };

            const existingLineages = useMemo(() => {
                return cards.map(c => ({
                    card: c,
                    chain: getLineageChain(c, cardsMap),
                    fullName: c.name || ''
                })).filter(item => item.chain.length > 0);
            }, [cards]);

            const autocompleteSuggestions = useMemo(() => {
                if (focusedPartIndex === null || focusedPartIndex === 0) return [];
                const currentTyped = (nameParts[focusedPartIndex] || '').trim();
                if (!currentTyped) return [];

                const matches = [];
                const seenKeys = new Set();

                existingLineages.forEach(({ card, chain }) => {
                    if (isEdit && card.id === initialData.id) return;
                    if (chain[0] && chain[0].includes(currentTyped)) {
                        const key = chain.join('-');
                        if (!seenKeys.has(key)) {
                            seenKeys.add(key);
                            matches.push({ card, chain });
                        }
                    }
                });
                return matches.slice(0, 6);
            }, [focusedPartIndex, nameParts, existingLineages]);

            const matchedAncestorCard = useMemo(() => {
                const ancestorSeq = nameParts.slice(1).map(p => p.trim()).filter(Boolean);
                if (ancestorSeq.length === 0) return null;
                for (const { card, chain } of existingLineages) {
                    if (isEdit && card.id === initialData.id) continue;
                    const isMatch = ancestorSeq.every((part, idx) => chain[idx] === part);
                    if (isMatch && chain.length >= ancestorSeq.length) {
                        return card;
                    }
                }
                return null;
            }, [nameParts, existingLineages]);

            const handlePartChange = (index, value) => {
                if (applySmartNameParsing(value, index)) {
                    return;
                }
                const updated = [...nameParts];
                updated[index] = value;
                setNameParts(updated);
                setFullNameText(buildFullName(updated, gender, false));
            };

            const handleFullNameTextChange = (e) => {
                const value = e.target.value;
                setFullNameText(value);
                const parsed = parseNameParts(value);
                setNameParts(parsed.length > 0 ? parsed : ['']);
                if (/(?:^|\s)(?:بن|بنت|ابن|ابنة)(?:\s|$)/.test(value)) {
                    const detected = detectGenderFromText(value, gender);
                    if (!genderLockedByUser) {
                        setGender(detected);
                    }
                }
            };

            const resolveParentForParts = async (cleanParts, excludeId) => {
                if (cleanParts.length <= 1) return null;
                const ancestorSequence = cleanParts.slice(1);
                for (const candidate of cards) {
                    if (excludeId && candidate.id === excludeId) continue;
                    const chain = getLineageChain(candidate, cardsMap);
                    const isMatch = ancestorSequence.every((part, idx) => chain[idx] && chain[idx].trim() === part);
                    if (isMatch && chain.length >= ancestorSequence.length) return candidate.id;
                }
                let currentParentId = null;
                for (let i = cleanParts.length - 1; i >= 1; i--) {
                    const ancestorFirst = cleanParts[i];
                    const subChain = cleanParts.slice(i);
                    const existingAncestor = cards.find(c =>
                        (!excludeId || c.id !== excludeId) &&
                        (c.firstName === ancestorFirst || parseNameParts(c.name)[0] === ancestorFirst) &&
                        (c.parentId || null) === currentParentId
                    );
                    if (existingAncestor) {
                        currentParentId = existingAncestor.id;
                    } else {
                        const newAncestorRef = doc(collection(db, "flashcards"));
                        await setDoc(newAncestorRef, {
                            name: buildFullName(subChain, 'male', true),
                            firstName: ancestorFirst,
                            gender: 'male',
                            parentId: currentParentId,
                            tags,
                            description: '',
                            image: '',
                            correctCount: 0,
                            wrongCount: 0,
                            userId: user?.uid || 'anonymous'
                        });
                        currentParentId = newAncestorRef.id;
                    }
                }
                return currentParentId;
            };

            // جنس فعلي مأخوذ من بيانات البطاقة المخزنة (وليس من حالة النموذج القابلة للتغيير)
            // حتى لا تنعكس تسمية الأقارب خطأً إذا اختلفت حالة النموذج عن المسجل في قاعدة البيانات
            const effGender = me ? getEffectiveGender(me) : gender;

            // زواج البطاقة كما هو مسجل فعلياً في قاعدة البيانات
            const myMarriagesForDisplay = useMemo(() =>
                me ? (effGender === 'female' ? getWomanMarriages(me) : getFatherMarriages(me)) : [],
                [me, effGender, cards, cardsMap]);

            // معرفات الشركاء الحاليين لاستثنائهم من اقتراحات إضافة زوج/زوجة
            const existingPartnerIds = useMemo(() => {
                const set = new Set();
                myMarriagesForDisplay.forEach(m => {
                    const p = effGender === 'female' ? m.husband : cardsMap.get(m.wifeId);
                    if (p) set.add(p.id);
                });
                return set;
            }, [myMarriagesForDisplay, effGender, cardsMap]);

            const spouseCandidates = useMemo(() => {
                const q = spouseQuery.trim();
                if (!q) return [];
                const opposite = gender === 'female' ? 'male' : 'female';
                return cards
                    .filter(c => getEffectiveGender(c) === opposite && (!isEdit || c.id !== initialData.id))
                    .filter(c => !existingPartnerIds.has(c.id))
                    .filter(c => {
                        const hay = `${c.firstName || ''} ${stripClanSuffix(c.name || '')}`;
                        return q.split(/\s+/).every(w => hay.includes(w));
                    })
                    .slice(0, 6);
            }, [spouseQuery, cards, gender, isEdit, initialData, existingPartnerIds]);

            const handleAddSpouse = async (existingCard = null) => {
                if (!isEdit || !initialData) return;
                const q = spouseQuery.trim();
                if (!existingCard && !q) return;
                setIsSavingRelative(true);
                try {
                    let spouseCard = existingCard;
                    if (!spouseCard) {
                        const spouseGender = effGender === 'female' ? 'male' : 'female';
                        const parts = parseNameParts(q);
                        const firstName = parts[0] || q;
                        const parentId = await resolveParentForParts(parts, null);
                        const newRef = doc(collection(db, "flashcards"));
                        spouseCard = { id: newRef.id, firstName, gender: spouseGender, husbandIds: [], marriages: [] };
                        await setDoc(newRef, {
                            name: buildFullName(parts, spouseGender, true),
                            firstName,
                            gender: spouseGender,
                            parentId,
                            motherId: null,
                            tags,
                            description: '',
                            image: '',
                            correctCount: 0,
                            wrongCount: 0,
                            userId: user?.uid || 'anonymous'
                        });
                    }

                    if (effGender !== 'female') {
                        const ms = Array.isArray(me.marriages) ? [...me.marriages] : [];
                        if (!ms.find(m => m.wifeId === spouseCard.id)) ms.push({ wifeId: spouseCard.id, status: 'active' });
                        await updateDoc(doc(db, "flashcards", me.id), { marriages: ms });
                        const wh = Array.isArray(spouseCard.husbandIds) ? [...spouseCard.husbandIds] : [];
                        if (!wh.includes(me.id)) {
                            await updateDoc(doc(db, "flashcards", spouseCard.id), { husbandIds: [...wh, me.id] });
                        }
                    } else {
                        const ms = Array.isArray(spouseCard.marriages) ? [...spouseCard.marriages] : [];
                        if (!ms.find(m => m.wifeId === me.id)) ms.push({ wifeId: me.id, status: 'active' });
                        await updateDoc(doc(db, "flashcards", spouseCard.id), { marriages: ms });
                        const wh = Array.isArray(me.husbandIds) ? [...me.husbandIds] : [];
                        if (!wh.includes(spouseCard.id)) {
                            await updateDoc(doc(db, "flashcards", me.id), { husbandIds: [...wh, spouseCard.id] });
                        }
                    }
                    setSpouseQuery('');
                    showNotification(existingCard ? 'تم ربط الزوج/ة الموجود بالبطاقة' : `تم إنشاء "${spouseCard.firstName}" وربطه/ها زوجاً/زوجة`, 'success');
                } catch (err) {
                    console.error(err);
                    showNotification('حدث خطأ أثناء إضافة الزوج/ة', 'error');
                } finally {
                    setIsSavingRelative(false);
                }
            };

            const existingChildren = useMemo(() => {
                if (!me) return [];
                return gender === 'female'
                    ? cards.filter(c => c.motherId === me.id)
                    : cards.filter(c => c.parentId === me.id);
            }, [me, cards, gender]);

            const myMarriagesAsWoman = useMemo(() =>
                (me && gender === 'female') ? getWomanMarriages(me) : [],
                [me, gender, cards, cardsMap]);

            const myActiveWives = useMemo(() =>
                (me && gender !== 'female') ? getFatherMarriages(me).filter(m => m.status !== 'divorced') : [],
                [me, gender, cards, cardsMap]);

            const myActiveWivesAll = useMemo(() =>
                (me && gender !== 'female') ? getFatherMarriages(me) : [],
                [me, gender, cards, cardsMap]);

            const childCandidates = useMemo(() => {
                const q = childName.trim();
                if (!q || !isEdit || !initialData) return [];
                const forbidden = new Set([initialData.id]);
                let curr = initialData;
                while (curr && curr.parentId && !forbidden.has(curr.parentId)) {
                    forbidden.add(curr.parentId);
                    curr = cardsMap.get(curr.parentId);
                }
                const queue = [initialData.id];
                while (queue.length) {
                    const id = queue.shift();
                    cards.forEach(c => {
                        if (c.parentId === id && !forbidden.has(c.id)) {
                            forbidden.add(c.id);
                            queue.push(c.id);
                        }
                    });
                }
                return cards
                    .filter(c => !forbidden.has(c.id))
                    .filter(c => {
                        const hay = `${c.firstName || ''} ${stripClanSuffix(c.name || '')}`;
                        return q.split(/\s+/).every(w => hay.includes(w));
                    })
                    .slice(0, 6);
            }, [childName, isEdit, initialData, cards, cardsMap]);

            const resolveChildPlacement = () => {
                if (gender === 'female') {
                    const active = myMarriagesAsWoman.filter(m => m.status !== 'divorced');
                    const chosen = childFatherId ? cardsMap.get(childFatherId) : (active.length === 1 ? active[0].husband : null);
                    if (!chosen) return null;
                    return { parentId: chosen.id, motherId: me.id };
                }
                return { parentId: me.id, motherId: childMotherId || (myActiveWives.length === 1 ? myActiveWives[0].wifeId : null) };
            };

            const saveChildTo = async (targetCard, placement) => {
                const childFirst = (targetCard.firstName || parseNameParts(targetCard.name)[0] || '').trim();
                const childGender = getEffectiveGender(targetCard);
                const fatherCard = cardsMap.get(placement.parentId);
                const chain = [childFirst, ...getLineageChain(fatherCard || initialData, cardsMap)];
                await updateDoc(doc(db, "flashcards", targetCard.id), {
                    firstName: childFirst,
                    name: buildFullName(chain, childGender, true),
                    parentId: placement.parentId,
                    motherId: placement.motherId || null,
                    parentsDivorced: false,
                    tags: Array.from(new Set([...(targetCard.tags || []), ...(fatherCard?.tags || []), ...tags]))
                });
                const updateDescendantsLineage = async (parentNodeId, currentAncestorChain) => {
                    const directKids = cards.filter(c => c.parentId === parentNodeId);
                    for (const kid of directKids) {
                        const kidFirst = (kid.firstName || parseNameParts(kid.name)[0] || '').trim();
                        const kidGender = getEffectiveGender(kid);
                        const kidChain = [kidFirst, ...currentAncestorChain];
                        await updateDoc(doc(db, "flashcards", kid.id), {
                            firstName: kidFirst,
                            name: buildFullName(kidChain, kidGender, true)
                        });
                        await updateDescendantsLineage(kid.id, kidChain);
                    }
                };
                await updateDescendantsLineage(targetCard.id, chain);
            };

            const handleAddChild = async () => {
                const q = childName.trim();
                if (!isEdit || !initialData || !q) return;
                setIsSavingRelative(true);
                try {
                    const parts = parseNameParts(q);
                    const childFirst = parts[0] || q;
                    const detected = detectGenderFromText(q, 'male');
                    let placement = resolveChildPlacement();
                    if (parts.length > 1) {
                        const autoParent = await resolveParentForParts(parts, initialData.id);
                        if (autoParent && (!placement || autoParent !== placement.parentId)) {
                            placement = { parentId: autoParent, motherId: gender === 'female' ? initialData.id : (childMotherId || null) };
                        }
                    }
                    if (!placement) {
                        showNotification('حدد زوجاً أولاً لإضافة ابنها (من قسم الزوج أعلاه)', 'error');
                        return;
                    }
                    const fatherCard = cardsMap.get(placement.parentId);
                    const chain = [childFirst, ...getLineageChain(fatherCard || initialData, cardsMap)];
                    const newRef = doc(collection(db, "flashcards"));
                    await setDoc(newRef, {
                        name: buildFullName(chain, detected, true),
                        firstName: childFirst,
                        gender: detected,
                        parentId: placement.parentId,
                        motherId: placement.motherId || null,
                        tags: Array.from(new Set([...tags, ...(fatherCard?.tags || [])])),
                        description: '',
                        image: '',
                        correctCount: 0,
                        wrongCount: 0,
                        userId: user?.uid || 'anonymous'
                    });
                    setChildName('');
                    showNotification(`تمت إضافة "${childFirst}" (${detected === 'female' ? 'بنت' : 'بن'}) كابن/ابنة`, 'success');
                } catch (err) {
                    console.error(err);
                    showNotification('حدث خطأ أثناء إضافة الابن/الابنة', 'error');
                } finally {
                    setIsSavingRelative(false);
                }
            };

            const handleAttachChildCandidate = async (candidate) => {
                if (!isEdit || !initialData) return;
                setIsSavingRelative(true);
                try {
                    const placement = resolveChildPlacement();
                    if (!placement) {
                        showNotification('حدد زوجاً أولاً لربط ابنها', 'error');
                        return;
                    }
                    await saveChildTo(candidate, placement);
                    setChildName('');
                    showNotification(`تم نقل "${candidate.firstName || parseNameParts(candidate.name)[0]}" لتصبح ابناً/ابنة`, 'success');
                } catch (err) {
                    console.error(err);
                    showNotification('حدث خطأ أثناء نقل البطاقة', 'error');
                } finally {
                    setIsSavingRelative(false);
                }
            };

            const handleSelectAutocomplete = (index, selectedChain) => {
                const prefix = nameParts.slice(0, index);
                const merged = [...prefix, ...selectedChain];
                setNameParts(merged);
                setFullNameText(buildFullName(merged, gender, false));
                setFocusedPartIndex(null);

                const matchedNode = existingLineages.find(l => l.chain.join('-') === selectedChain.join('-'))?.card;
                if (matchedNode?.tags?.length > 0) {
                    const newTags = Array.from(new Set([...tags, ...matchedNode.tags]));
                    setTags(newTags);
                }
            };

            const handleAddNameSlot = () => {
                setNameParts([...nameParts, '']);
            };

            const handleRemoveNameSlot = (idx) => {
                if (nameParts.length <= 1) return;
                setNameParts(nameParts.filter((_, i) => i !== idx));
            };

            const handleImageUpload = (e) => {
              const file = e.target.files[0];
              if (file) {
                setImageFile(file);
                const url = URL.createObjectURL(file);
                setImage(url);
              }
            };

            const handlePaste = (e) => {
              const items = e.clipboardData?.items;
              if (!items) return;
              for (let i = 0; i < items.length; i++) {
                if (items[i].type.indexOf('image') !== -1) {
                  const file = items[i].getAsFile();
                  if (file) {
                    setImageFile(file);
                    const url = URL.createObjectURL(file);
                    setImage(url);
                  }
                  break;
                }
              }
            };

            const handleAddTag = (e) => {
              if (e.key === 'Enter') {
                e.preventDefault();
                const val = tagInput.trim();
                if (val && !tags.includes(val)) {
                  setTags([...tags, val]);
                }
                setTagInput('');
              }
            };

            const handleRemoveTag = (tagToRemove) => {
              setTags(tags.filter(t => t !== tagToRemove));
            };

            const compressImageToBase64 = (file) => {
              return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                  const img = new window.Image();
                  img.src = event.target.result;
                  img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    const MAX_HEIGHT = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                      if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                      if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                    resolve(dataUrl);
                  };
                  img.onerror = (error) => reject(error);
                };
                reader.onerror = (error) => reject(error);
              });
            };

            const handleSave = async (e) => {
              e.preventDefault();
              const hasAnyName = nameParts.some(p => p.trim() !== '');
              if (!hasAnyName && !image && !description && !imageFile) {
                showNotification("الرجاء تعبئة حقل واحد على الأقل (الاسم، الصورة، أو الوصف)!", "error");
                return;
              }
              
              setIsUploading(true);
              let finalImageUrl = image;

              try {
                if (imageFile) {
                  finalImageUrl = await compressImageToBase64(imageFile);
                }
                const fullName = buildFullName(nameParts, gender, true);
                const cleanPartsForSave = nameParts.map(p => p.trim()).filter(Boolean);
                await onSave(
                    {
                        name: fullName,
                        firstName: nameParts[0]?.trim() || '',
                        gender,
                        motherId: motherId || null,
                        description,
                        image: finalImageUrl,
                        tags,
                        // إذا حُذف اسم الأب وكل الأسلاف وبقي الاسم الأول فقط تُفصل البطاقة عن أبيها (تصبح فرعاً حراً)
                        parentId: cleanPartsForSave.length > 1 ? (initialData?.parentId || null) : null
                    },
                    isEdit,
                    initialData?.id,
                    nameParts
                );
              } catch (error) {
                console.error("Error processing image:", error);
                showNotification("حدث خطأ أثناء حفظ الصورة.", "error");
              } finally {
                setIsUploading(false);
              }
            };

            const previewFullName = buildFullName(nameParts, gender, true);

            return (
              <div onPaste={handlePaste} className="max-w-2xl mx-auto bg-white p-6 sm:p-8 rounded-3xl shadow-sm border border-gray-100 animate-in slide-in-from-bottom-4 mt-4 sm:mt-8">
                <div className="flex items-center justify-between mb-6">
                  <h2 className="text-2xl font-bold text-gray-800 flex items-center gap-3">
                    <span className="bg-blue-100 text-blue-600 p-2 rounded-xl">
                      {isEdit ? <Edit size={24} /> : <Plus size={24} />}
                    </span>
                    {isEdit ? 'تعديل البطاقة' : 'إضافة بطاقة جديدة'}
                  </h2>
                  <button onClick={() => { setView('gallery'); setEditingCard(null); }} className="text-gray-500 hover:text-gray-800 flex items-center gap-2 bg-gray-50 px-4 py-2 rounded-xl transition">
                    عودة <ChevronRight size={18} />
                  </button>
                </div>

                <form onSubmit={handleSave} className="space-y-6">
                  <div>
                    <label className="block text-gray-700 font-bold mb-2">الجنس (يُحدد تلقائياً عند كتابة "بن" أو "بنت")</label>
                    <div className="grid grid-cols-2 gap-4">
                      <button
                        type="button"
                        onClick={() => handleGenderSelect('male')}
                        className={`p-3.5 rounded-2xl border-2 flex items-center gap-3 transition ${
                          gender === 'male'
                            ? 'border-sky-500 bg-sky-50/80 text-sky-900 shadow-sm'
                            : 'border-gray-200 bg-gray-50 text-gray-600 hover:bg-gray-100'
                        }`}
                      >
                        <div className="w-12 h-12 rounded-xl bg-sky-100 border-2 border-sky-300 overflow-hidden shrink-0">
                          <MaleDefaultAvatar />
                        </div>
                        <div className="text-right">
                          <div className="font-bold text-base">ذكر (بن)</div>
                          <div className="text-xs text-sky-600">مربع أزرق (زي جنوبي وبندقية)</div>
                        </div>
                      </button>

                      <button
                        type="button"
                        onClick={() => handleGenderSelect('female')}
                        className={`p-3.5 rounded-2xl border-2 flex items-center gap-3 transition ${
                          gender === 'female'
                            ? 'border-pink-500 bg-pink-50/80 text-pink-900 shadow-sm'
                            : 'border-gray-200 bg-gray-50 text-gray-600 hover:bg-gray-100'
                        }`}
                      >
                        <div className="w-12 h-12 rounded-full bg-pink-100 border-2 border-pink-300 overflow-hidden shrink-0">
                          <AsiriWomanAvatar />
                        </div>
                        <div className="text-right">
                          <div className="font-bold text-base">أنثى (بنت)</div>
                          <div className="text-xs text-pink-600">دائري وردي (لبس عسيري)</div>
                        </div>
                      </button>
                    </div>
                  </div>

                  <div className="bg-gray-50/80 p-4 rounded-2xl border border-gray-200">
                    <div className="flex items-center justify-between mb-2">
                      <label className="text-gray-800 font-bold flex items-center gap-2">
                        <GitFork size={18} className="text-blue-600" />
                        تسلسل الاسم (الاسم الأول - الثاني - الثالث...)
                      </label>
                      <button
                        type="button"
                        onClick={handleAddNameSlot}
                        className="text-xs bg-blue-100 text-blue-700 hover:bg-blue-200 px-3 py-1.5 rounded-lg font-bold flex items-center gap-1 transition"
                      >
                        <Plus size={14} /> إضافة اسم أب/جد
                      </button>
                    </div>
                    <p className="text-xs text-gray-500 mb-3">
                      يمكنك كتابة الاسم كاملاً مثل <span className="font-bold text-gray-700">"نورة بنت محمد بن سعيد"</span> أو <span className="font-bold text-gray-700">"فهد بن سعد بن علي"</span> وسيتم فصله تلقائياً وتحديد الجنس.
                    </p>

                    {autoSplitNotice && (
                      <div className="mb-3 bg-indigo-50 border border-indigo-200 text-indigo-800 text-xs font-bold px-3 py-2 rounded-xl flex items-center justify-between">
                        <span className="flex items-center gap-1.5"><Sparkles size={14} className="text-indigo-600" /> {autoSplitNotice}</span>
                        <button type="button" onClick={() => setAutoSplitNotice('')} className="text-indigo-400 hover:text-indigo-700">
                          <X size={14} />
                        </button>
                      </div>
                    )}

                    <div className="flex flex-wrap items-center gap-2 relative">
                      {nameParts.map((part, idx) => (
                        <React.Fragment key={idx}>
                          {idx > 0 && (
                            <span className={`text-xs font-black px-2 py-0.5 rounded-md ${
                              idx === 1 && gender === 'female'
                                ? 'bg-pink-100 text-pink-700'
                                : 'bg-sky-100 text-sky-700'
                            }`}>
                              {idx === 1 ? (gender === 'female' ? 'بنت' : 'بن') : 'بن'}
                            </span>
                          )}
                          <div className="relative flex-1 min-w-[110px]">
                            <input
                              type="text"
                              value={part}
                              onFocus={() => setFocusedPartIndex(idx)}
                              onBlur={() => setTimeout(() => setFocusedPartIndex(null), 200)}
                              onChange={(e) => handlePartChange(idx, e.target.value)}
                              placeholder={
                                idx === 0 ? 'الاسم الأول' :
                                idx === 1 ? 'الاسم الثاني (الأب)' :
                                idx === 2 ? 'الاسم الثالث (الجد)' : `الاسم ${idx + 1}`
                              }
                              className={`w-full border rounded-xl px-3 py-2.5 text-sm font-bold focus:outline-none focus:ring-2 transition ${
                                idx === 0
                                  ? 'border-blue-300 bg-white focus:ring-blue-500 text-gray-900'
                                  : 'border-gray-200 bg-white focus:ring-indigo-500 text-gray-700'
                              }`}
                            />
                            {idx > 0 && (
                              <button
                                type="button"
                                onClick={() => handleRemoveNameSlot(idx)}
                                className="absolute left-1.5 top-1/2 -translate-y-1/2 text-gray-300 hover:text-red-500 p-0.5"
                                title={idx === 1 ? 'حذف اسم الأب (ستُفصل البطاقة عن أبيها إن لم يبقَ أسلاف)' : 'حذف هذه الخانة'}
                              >
                                <X size={14} />
                              </button>
                            )}

                            {focusedPartIndex === idx && autocompleteSuggestions.length > 0 && (
                              <div className="absolute z-30 right-0 mt-1 w-64 bg-white rounded-2xl shadow-xl border border-blue-100 overflow-hidden animate-in fade-in">
                                <div className="bg-blue-50 px-3 py-1.5 text-[11px] font-bold text-blue-700 flex items-center gap-1">
                                  <Sparkles size={12} /> تسلسلات موجودة في المشجرة:
                                </div>
                                {autocompleteSuggestions.map(({ card, chain }) => (
                                  <button
                                    key={card.id}
                                    type="button"
                                    onMouseDown={() => handleSelectAutocomplete(idx, chain)}
                                    className="w-full text-right px-3 py-2.5 hover:bg-blue-50/70 transition border-b border-gray-50 last:border-0 flex items-center justify-between gap-2"
                                  >
                                    <div>
                                      <div className="text-sm font-bold text-gray-800">{chain.join(' بن ')}</div>
                                      {card.tags?.[0] && (
                                        <span className="text-[10px] text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full">
                                          فرع: {card.tags[0]}
                                        </span>
                                      )}
                                    </div>
                                    <ChevronRight size={14} className="text-gray-400 rotate-180" />
                                  </button>
                                ))}
                              </div>
                            )}
                          </div>
                        </React.Fragment>
                      ))}
                    </div>

                    {previewFullName && (
                      <div className="mt-3 pt-3 border-t border-gray-200/80 flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs">
                        <div className="text-gray-600">
                          الاسم الكامل في البطاقة: <span className="font-black text-gray-900 text-sm">{previewFullName}</span>
                        </div>
                        {nameParts.slice(1).some(p => p.trim()) && (
                          matchedAncestorCard ? (
                            <span className="bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full font-bold inline-flex items-center gap-1 w-fit">
                              <Check size={12} /> سيرتبط تلقائياً كفرع لـ ({matchedAncestorCard.firstName || parseNameParts(matchedAncestorCard.name)[0]})
                            </span>
                          ) : (
                            <span className="bg-amber-100 text-amber-800 px-2.5 py-1 rounded-full font-bold inline-flex items-center gap-1 w-fit">
                              <GitFork size={12} /> سينشئ تسلسل جديد تحت {CLAN_ROOT_TITLE}
                            </span>
                          )
                        )}
                      </div>
                    )}
                    <div className="mt-3 pt-3 border-t border-dashed border-gray-300">
                      <label className="block text-xs font-bold text-gray-600 mb-1.5">
                        أو اكتب الاسم كاملاً هنا (يتعرف تلقائياً على «بن» و«بنت» و«آل» ويعبئ الخانات أعلاه):
                      </label>
                      <input
                        type="text"
                        value={fullNameText}
                        onChange={handleFullNameTextChange}
                        placeholder="مثال: نورة بنت محمد بن آل سعد"
                        className="w-full border border-indigo-200 bg-white rounded-xl px-3 py-2.5 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-indigo-400 text-gray-800"
                      />
                    </div>
                  </div>

                  {femaleCards.length > 0 && (
                    <div className="bg-pink-50/60 p-4 rounded-2xl border border-pink-200">
                      <label className="block text-pink-900 font-bold mb-1.5 flex items-center gap-2 text-sm">
                        <Heart size={16} className="text-pink-600" /> الأم (اختياري - أو اسحب خط الأبناء في المشجرة إلى الأم مباشرة)
                      </label>
                      <select
                        value={motherId}
                        onChange={(e) => setMotherId(e.target.value)}
                        className="w-full border border-pink-200 rounded-xl px-4 py-2.5 bg-white text-gray-800 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-pink-400"
                      >
                        <option value="">-- بدون تحديد أم حالياً --</option>
                        {femaleCards.map(f => (
                          <option key={f.id} value={f.id}>
                            {getDisplayFullName(f)}
                          </option>
                        ))}
                      </select>
                    </div>
                  )}

                  {isEdit && (
                    <div className="bg-sky-50/70 p-4 rounded-2xl border border-sky-200 relative">
                      <label className="block text-sky-900 font-bold mb-1 flex items-center gap-2 text-sm">
                        <Heart size={16} className="text-sky-600" /> إضافة {(isEdit ? effGender : gender) === 'female' ? 'زوج' : 'زوجة'} (اختياري)
                      </label>

                      {/* الزوج/الزوجة الحاليون كما هما مسجلان (اضغط للانتقال إلى البطاقة) */}
                      {myMarriagesForDisplay.filter(m => {
                        const p = effGender === 'female' ? m.husband : cardsMap.get(m.wifeId);
                        return p && p.id !== me.id;
                      }).length > 0 && (
                        <div className="flex flex-wrap gap-1.5 mb-2">
                          {myMarriagesForDisplay.map((m, idx) => {
                            const p = effGender === 'female' ? m.husband : cardsMap.get(m.wifeId);
                            if (!p || p.id === me.id) return null;
                            const isDiv = m.status === 'divorced';
                            return (
                              <button
                                key={p.id}
                                type="button"
                                onClick={() => navigateToRelative(p)}
                                title="الضغط ينقلك إلى بطاقة الزوج/الزوجة"
                                className={`px-3 py-1.5 rounded-full text-[11px] font-bold border transition inline-flex items-center gap-1.5 ${
                                  isDiv
                                    ? 'bg-red-50 text-red-700 border-red-300 hover:bg-red-100'
                                    : effGender === 'female'
                                      ? 'bg-sky-100 text-sky-800 border-sky-300 hover:bg-sky-200'

                      const wifeCard = cardsMap.get(m.wifeId);

                          wifeId: m.wifeId,
                          wifeCard,
                          status: m.status || 'active',
                          children: kids
                      });
                  });

                  const unassignedKids = allChildren.filter(c => !assignedChildIds.has(c.id));
                  if (unassignedKids.length > 0) {
                      bundles.push({
                          wifeId: 'UNASSIGNED',
                          wifeCard: null,
                          status: 'active',
                          children: unassignedKids

                                  isDropTarget
                                      ? 'border-pink-600 ring-4 ring-pink-300 scale-110 bg-pink-50 z-20'

                                          ? 'border-pink-200 hover:border-pink-400 bg-gradient-to-b from-white to-pink-50/40'

                                      setQuickBranchMotherId(null);

                                      setQuickBranchSearch('');
                                      setQuickBranchName('');
                                      setQuickBranchGender('male');
                                  }}
                                  title={`إضافة ابن/بنت لـ ${firstNameDisplay} (جديد أو اختيار من البطاقات الحالية)`}
                                  className={`w-6 h-6 rounded-full flex items-center justify-center text-white shadow-sm transition-transform hover:scale-110 active:scale-95 ${

                              >
                                  <Plus size={14} strokeWidth={3} />

                                      type="button"

                                              else lineAnchorRefs.current.delete(`${node.id}__UNASSIGNED`);
                                          }

                                      onMouseDown={(e) => startDraggingFromAnchor(e, node.id, 'UNASSIGNED')}

                                      <Heart size={12} />
                                  </button>

                                              ref={(el) => {

                              const _c = treeContainerRef.current;
                              const _z = treeZoom || 1;
                              const _sl = _c ? Math.max(0, _c.scrollLeft) : 0;
                              const _st = _c ? Math.max(0, _c.scrollTop) : 0;
                              const sx = (x) => (x - _sl) * _z + _sl;
                              const sy = (y) => (y - _st) * _z + _st;

                                  const midY = (y1 + y2) / 2;
                                  const strokeColor = line.isDivorced ? '#991b1b' : '#ec4899';

                                  const ctrlX2 = x2 - (x2 - midX) * 0.65;
                                  const pathD = `M ${x1} ${y1} C ${ctrlX1} ${y1}, ${ctrlX2} ${y2}, ${x2} ${y2}`;

                                  return (

                                          <path

                                              fill="none"
                                              stroke={strokeColor}

                                          {line.isDivorced && (

                                                  <line x1="-5" y1="-5" x2="5" y2="5" stroke="#ffffff" strokeWidth="2.5" strokeLinecap="round" />

                                              </g>
                                          )}
                                      </g>
                                  );
                              })}

                                          strokeWidth="3"

                            <div className="bg-white rounded-3xl shadow-xl border border-red-200 p-8 max-w-lg text-center">
                                <div className="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-black">!</div>
                                <h2 className="text-xl font-black text-gray-800 mb-2">حدث خطأ غير متوقع</h2>
                                <p className="text-sm text-gray-500 mb-6 leading-relaxed">تعذر عرض الصفحة. حاول تحديثها، وإن استمرت المشكلة فتحقق من اتصالك بالإنترنت (مكتبات التحميل الخارجية) ومن إعدادات Firebase.</p>
                                <button onClick={() => window.location.reload()} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition">تحديث الصفحة</button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>

    <!-- حارس ضد الشاشة البيضاء الصامتة: إذا فشل تحميل أي مكتبة خارجية (CDN/Firebase) لا يصل الخطأ إلى React، فنعرض رسالة واضحة -->
    <script>
        window.addEventListener('load', function () {
            setTimeout(function () {
                var rootEl = document.getElementById('root');
                if (!rootEl || rootEl.children.length === 0) {
                        rootEl.innerHTML =
                            '<div dir="rtl" style="min-height:80vh;display:flex;align-items:center;justify-content:center;padding:24px;">' +
                            '<div style="background:#fff;border:1px solid #fecaca;border-radius:24px;padding:32px;max-width:480px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.08);">' +
                            '<div style="width:56px;height:56px;border-radius:9999px;background:#fee2e2;color:#dc2626;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-weight:900;font-size:24px;">!</div>' +
                            '<h2 style="font-size:20px;font-weight:900;color:#1f2937;margin-bottom:8px;">تعذر تشغيل التطبيق</h2>' +
                            '<p style="font-size:14px;color:#6b7280;margin-bottom:20px;line-height:1.8;">تعذر تحميل مكتبات التشغيل الخارجية (React / Firebase). تأكد من اتصالك بالإنترنت ثم أعد تحميل الصفحة.</p>' +
                            '<button onclick="window.location.reload()" style="width:100%;background:#2563eb;color:#fff;font-weight:700;padding:12px;border-radius:12px;border:none;cursor:pointer;font-size:15px;">إعادة التحميل</button>' +
                            '</div></div>';
                }
            }, 10000);
        });
    </script>
</body>
